  <path d="M 18 13 V 24 M 15.2 15.8 L 18 13 L 20.8 15.8" stroke="#0078D7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 29 24 V 13 M 26.2 21.2 L 29 24 L 31.8 21.2" stroke="#0078D7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- easel stand -->
