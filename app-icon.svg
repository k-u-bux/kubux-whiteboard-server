<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- tile -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0078D7"/>
  <!-- board -->
  <rect x="9" y="8" width="30" height="21" rx="3" fill="#FFFFFF"/>
