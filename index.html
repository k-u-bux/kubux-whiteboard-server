      // Create a new board owned by the logged-in user
      async function createBoard(path) {
          const feedback = document.getElementById('manager-feedback');
          setFeedback('manager-feedback', '');
          let reply;
          try {
              reply = await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.CREATE_BOARD, {
                  [shared.MESSAGES.CLIENT_TO_SERVER.CREATE_BOARD.PATH]: path,
                  [shared.MESSAGES.CLIENT_TO_SERVER.CREATE_BOARD.CLIENT_ID]: clientId
              });
          } catch (err) {
              feedback.textContent = `Board not created: ${err.message}`;
              return;
          }
          if (reply.type !== shared.MESSAGES.SERVER_TO_CLIENT.BOARD_CREATED.TYPE) {
              feedback.textContent = `Board not created: ${reply.message}`;
              ownerRefused(reply);
              return;
          }
          handleBoardCreated(reply, shared.normalizePath(path));
      }
      
      // Handle board creation response: open the new board in this page and say so in
      // the board manager, whose Current Board section now has its links
      function handleBoardCreated(data, path = null) {
          debugLog('Board created successfully');
          const newBoardId = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_CREATED.BOARD];
          const newPasswd = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_CREATED.PASSWORD];
          switchToBoard(newBoardId, newPasswd);
          document.getElementById('new-board-name').value = '';
          creatingIn = null;
          setFeedback('manager-feedback',
              `Created ${path ? `"${path}" ` : 'the board '}and opened it; its links are under Current Board.`, true);
          if (session.loggedIn) {
              listBoards();
          }
      }
      
          
      // Save most recent board to localStorage
      function saveMostRecentBoard() {
          const boardData = {
              boardId: boardId,
              passwd: passwd,
              timestamp: Date.now()
          };
          
          localStorage.setItem('most_recent_board', shared.serialize(boardData));
          debugLog('Saved most recent board', boardData);
      }
      
      // Load most recent board from localStorage
      function loadMostRecentBoard() {
          try {
              const saved = localStorage.getItem('most_recent_board');
              if (!saved) return null;
              
              const boardData = shared.deserialize(saved);
              debugLog('Loaded most recent board', boardData);
              return boardData;
          } catch (err) {
              console.warn('Failed to load most recent board:', err);
              return null;
          }
      }

      // Register with an existing board
      function registerBoard(boardId) {
          const requestId = createRequestId();
          
          const registerMessage = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_BOARD.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_BOARD.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_BOARD.CLIENT_ID]: clientId,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_BOARD.REQUEST_ID]: requestId
          };
          
          debugLog('Sending board registration:', registerMessage);
          ws.send(JSON.stringify(registerMessage));
      }
      
      // Handle board registration response
      function handleBoardRegistered(data) {
          debugLog('Board registered successfully');
          connectionEstablished = true;
          hideError();
          
          const requestId = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.REQUEST_ID];
          
          // On a reconnect: the page we were on, and the edits the server has not
          // confirmed, before the reset drops them (on the first load there is no page)
          const previousPage = currentPageUuid;
          const unconfirmedEdits = history.slice(Math.min(verifiedIndex, present), present);
          
          // Reset local state
          history = [];
          present = 0;
          hashes = [];
          verifiedIndex = 0;
          visualState = shared.createEmptyVisualState();
          
          // Update board ID and URL if necessary
          boardId = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.BOARD];
          // First load: edits this tab had not got confirmed before a reload
          const savedEdits = previousPage ? null : takeSavedEdits();
          const firstPageId = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.FIRST_PAGE];
          const lastPageId = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.LAST_PAGE];
          const numPages = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.TOTAL_PAGES];
          showShareAddress();
          
          // Load settings now that we have a boardId
          loadSettings();
          updateKnobs();
          saveMostRecentBoard();
          if (previousPage) {
              // Return to that page. The server resolves a page deleted meanwhile to
              // its replacement (or the first page) and answers with page-registered.
              registerPage( previousPage, 0 );
          } else if (window.savedPagePosition) {
              // First load: reopen the board at the page this browser showed last
              registerPage( window.savedPagePosition.uuid, 0 );
          } else {
              joinPage( firstPageId, 1, numPages );
              // The server will send a full page message next, so we do not need
              // to request one explicitly
          }
          if (unconfirmedEdits.length > 0) {
              resendUnconfirmedEdits(previousPage, unconfirmedEdits);
          }
          if (savedEdits) {
              resendUnconfirmedEdits(savedEdits.page, savedEdits.edits);
          }
      }

      // Unconfirmed edits survive a reload of the tab: they are kept in sessionStorage,
      // which belongs to the tab and goes with it, and sent again on the next load.
      // Storage that is full or blocked only means the edits stay in memory.
      const SAVED_EDITS_KEY = 'whiteboard_unconfirmed_edits';

      function saveUnconfirmedEdits() {
          if (!boardId || !currentPageUuid) return;
          const edits = history.slice(Math.min(verifiedIndex, present), present);
          try {
              if (edits.length > 0) {
                  sessionStorage.setItem(SAVED_EDITS_KEY, JSON.stringify({ board: boardId, page: currentPageUuid, edits }));
              } else {
                  sessionStorage.removeItem(SAVED_EDITS_KEY);
              }
          } catch (err) {
              // storage full or blocked
          }
      }

      // The edits saved for this board before a reload (removed from storage)
      function takeSavedEdits() {
          try {
              const entry = JSON.parse(sessionStorage.getItem(SAVED_EDITS_KEY));
              sessionStorage.removeItem(SAVED_EDITS_KEY);
              if (entry && entry.board === boardId && Array.isArray(entry.edits) && entry.edits.length > 0) {
                  return entry;
              }
          } catch (err) {
              // storage blocked or entry unreadable
          }
          return null;
      }

      // Edits made while offline (or sent just before the connection dropped) are
      // the unconfirmed tail of the local history. Propose them again on top of
      // the server's current page; the server applies draw/erase/group actions to
      // whatever state it has, so they need no rebasing. Edits the server already
      // has are skipped; one whose target is gone by now is declined as usual.
      async function resendUnconfirmedEdits(pageUuid, edits) {
          let serverPage;
          try {
              serverPage = await fetchFullPage(pageUuid);
          } catch (err) {
              showError(`${edits.length} offline edit(s) could not be sent: ${err.message}`);
              return;
          }
          const known = new Set(serverPage.history.map(action => action[shared.MOD_ACTIONS.UUID]));
          let beforeHash = serverPage.hash;
          for (const action of edits) {
              if (known.has(action[shared.MOD_ACTIONS.UUID])) continue;
              const proposal = {
                  type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
                  [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
                  [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
                  [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: pageUuid,
                  [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: action,
                  [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: beforeHash
              };
              pending_register_action( action[shared.MOD_ACTIONS.UUID] );
              sendMessage(proposal);
              beforeHash = shared.hashNext(beforeHash, action);
          }
      }

      // While offline: how many edits wait in the unconfirmed tail of the history
      function waitingEditsNote() {
          const waiting = present - Math.min(verifiedIndex, present);
          return waiting > 0 ? ` ${waiting} edit${waiting === 1 ? '' : 's'} waiting to be sent.` : '';
      }

      // Page actions need the server, and leaving the page would strand its
      // unconfirmed edits, so they are refused while offline.
      function refusedWhileOffline() {
          if (connectionEstablished) return false;
          showError('Not connected to server: page actions are unavailable.' + waitingEditsNote());
          return true;
      }

      
      function registerPage( uuid, delta ) {
          const requestId = createRequestId();
          
          const registerMessage = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.PAGE]: uuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.DELTA]: delta,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.CLIENT_ID]: clientId,
              [shared.MESSAGES.CLIENT_TO_SERVER.REGISTER_PAGE.REQUEST_ID]: requestId
          };
          
          debugLog('Sending page registration:', registerMessage);
          ws.send(JSON.stringify(registerMessage));
      }

            
      function joinPage ( uuid, nr, total ) {
          currentPageUuid = uuid;
          pageNr = nr;
          totalPages = total;
          pagesMetaData[ currentPageUuid ] = [ pageNr, totalPages ];
          updatePageInfo();
          saveSettings(); // remembers the page for the next load

          // Check if we have this page cached (but only if not already in verification cycle)
          // const cachedPage = !cacheVerificationInProgress ? loadPageFromCache(pageUuid) : null;
          const cachedPage = loadPageFromCache(currentPageUuid);
          // let cachedPage = false;
          
          if (cachedPage) {
              debugLog('Using cached page data, requesting replay for updates');
              history = cachedPage.history;
              present = cachedPage.present;
              hashes = [ shared.hashAny( currentPageUuid ) ];
              for ( let i = 0; i < history.length; ++ i ) {
                  hashes.push( shared.hashNext( hashes[ i ], history[ i ] ) );
              }
              
              verifiedIndex = present;
              
              // Recompile visual state
              updateVisualState();
              updateSyncStatus();
              updateUndoRedoButtons();
              
              // Request replay to get any updates since we last visited
              requestReplay( currentPageUuid, true );
          } else {
              requestFullPage(currentPageUuid, true, 0);
          }
      }

      // Handle page registration response
      function handlePageRegistered(data) {
          const requestId = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_REGISTERED.REQUEST_ID];
          currentPageUuid  = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_REGISTERED.PAGE];
          pageNr = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_REGISTERED.PAGE_NR];
          totalPages = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_REGISTERED.TOTAL_PAGES];
          pagesMetaData[ currentPageUuid ] = [ pageNr, totalPages ];
          
          debugLog('Page registered successfully', {
              requestId,
              currentPageUuid,
              pageNr,
              totalPages
          });
          
          joinPage( currentPageUuid, pageNr, totalPages );
      }
      
      // Handle page info response (metadata only)
      function handlePageInfo(data) {
          const requestId = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.REQUEST_ID];
          const pageUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.PAGE];
          const pageNumber = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.PAGE_NR];
          const pageTotal = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.TOTAL_PAGES];
          const pageSnapshots = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.SNAPSHOTS];
          const do_switch = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.SWITCH];
          
          debugLog('Page info received', {
              requestId,
              pageUuid, pageNumber, pageTotal
          });
          
          pagesMetaData[ pageUuid ] = [ pageNumber, pageTotal ];
          const pageData = loadPageFromCache( pageUuid );
          const pageHashes = [ shared.hashAny( pageUuid ) ];
          for ( let i = 0; i < pageData['history'].length; ++ i ) {
              pageHashes.push( shared.hashNext( pageHashes[ i ], pageData['history'][ i ] ) );
          }

          for ( let j = pageSnapshots.length - 1; j >= 0; --j ) {
              const snapshot = pageSnapshots[ j ];
              const index = pageHashes.indexOf( snapshot );
              if ( index >= 0 ) {
                  pageData['present'] = index;
                  pageData['hash'] = snapshot;
                  savePageToCache( pageUuid, pageData );
                  requestReplay( pageUuid, do_switch );
                  return;
              }
          }          

          requestFullPage( pageUuid, do_switch );
      }
      
      // Handle page lost response (page deletion with redirection)
      function handlePageLost(data) {
          const requestId = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.REQUEST_ID];
          const replacementPage = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.PAGE];
          const lost = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.LOST];
          pageNr = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.PAGE_NR];
          totalPages = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.TOTAL_PAGES];
          
          if ( replacementPage != undefined ) {
              currentPageUuid = replacementPage;
          }

          debugLog('Page lost received', {
              requestId,
              currentPageUuid,
              lost,
              pageNr,
              totalPages
          });

          // (c) Overview — if overview is visible, refresh and skip joinPage
          if (isOverviewActive()) {
              refreshOverviewIfActive();
              return;
          }

          // (b) Page view — navigate to the page
          joinPage( currentPageUuid, pageNr, totalPages );
      }


      // Handle ping message from server

      // a ping between a mod-request and the accept/decline response shall be ignored
      // BUT: the response may get lost ==> we need a timeout.

      const RESPONSE_TIMEOUT = 100; // msecs
      let pending_actions = new Set();
      let pending_timer = Date.now();

      function pending_register_action ( uuid ) {
          pending_actions.add( uuid );
          pending_timer = Date.now();
          debugLog( `A total of ${pending_actions.size} actions is pending` );
      }

      function adjustVerfiedIndex ( snapshots ) {
          let index = 0;
          let the_index = 0;
          let alt_index = 0;
          while ( ( the_index <= verifiedIndex ) && ( alt_index < snapshots.length ) ) {
              let the_hash = hashes[ the_index ];
              let alt_hash = snapshots[ alt_index ];
              if ( the_hash != alt_hash ) {
                  ++ the_index;
                  the_hash = hashes[ the_index ];
              } else {
                  index = the_index;
                  ++ alt_index;
                  ++ the_index;
              }
          }
          verifiedIndex = index;
          present = index;
          commitCurrentPage();
      }
                                                                       
      function handlePingMessage(data) {
          if ( Date.now() > RESPONSE_TIMEOUT + pending_timer ) {
              pending_actions.clear();
          }
          // In overview mode, always process pings regardless of pending actions
          if ( !isOverviewActive() && pending_actions.size > 0 ) { 
            debugLog( "exit handlePingMessage because of pending actions" );
            return; 
          }

          const pingPageUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.PING.PAGE];
          const pingPageHash = data[shared.MESSAGES.SERVER_TO_CLIENT.PING.HASH];
          const pingPageNr = data[shared.MESSAGES.SERVER_TO_CLIENT.PING.PAGE_NR];
          const pingTotalPages = data[shared.MESSAGES.SERVER_TO_CLIENT.PING.TOTAL_PAGES];
          const pingSnapshots = data[shared.MESSAGES.SERVER_TO_CLIENT.PING.SNAPSHOTS];
          
          debugLog('Received ping', {
              pageNr: pageNr,
              totalPages: totalPages,
              serverPageUuid: pingPageUuid, 
              serverPageHash: pingPageHash, 
              serverPageNr: pingPageNr, 
              serverTotalPages: pingTotalPages,
              currentPageUuid: currentPageUuid,
              verifiedHash: hashes[ verifiedIndex ],
              pingSnapshots: pingSnapshots
          });
          
          // stay on the last page
          if ( pageNr === totalPages && totalPages < pingTotalPages ) {
              debugLog('Server indicates the board has grown. Stay on the last page');
              requestFullPage( currentPageUuid, true, pingTotalPages - totalPages );
              return;
          }

          // Check if we are on the wrong page
          if (currentPageUuid !== pingPageUuid) {
              debugLog('Server indicates we should be on a different page');
              if (pageSwitchUnderWay() !== pingPageUuid) {
                  requestPageInfo(pingPageUuid, true);
              }
              return;
          }
          
          // Update page info if needed
           if (pageNr !== pingPageNr || totalPages !== pingTotalPages) {
               pageNr = pingPageNr;
               totalPages = pingTotalPages;
               pagesMetaData[ currentPageUuid ] = [ pageNr, totalPages ];
               updatePageInfo();
               
               // (c) Overview — if overview is visible
               refreshOverviewIfActive();
           }
           
           // Check if our hash is out of sync with server
          // Look for matching hash in our hash chain
          let matchingIndex = hashes.indexOf( pingPageHash );
          
          if (matchingIndex === -1) {
              // Server hash not found in our hash chain
              debugLog(`Hash ${pingPageHash} not found in our chain, requesting replay.`, hashes );
              adjustVerfiedIndex( pingSnapshots );
              requestReplay( currentPageUuid, true );
          } else if (matchingIndex !== present) {
              debugLog(`Server is at position ${matchingIndex}, we are at ${present}`);
              present = matchingIndex;
              verifiedIndex = present;
              updateVisualState();
          } else {
              // We are in sync with server
              verifiedIndex = matchingIndex;
              updateSyncStatus();
          }
      }

      // Handle accept message from server
      function handleAcceptMessage(data) {
          const pageUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.PAGE];

          if ( currentPageUuid !== pageUuid ) {
              return;
          }

          // update page into
          pageNr = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.PAGE_NR];
          totalPages = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.TOTAL_PAGES];
          updatePageInfo();
          
          const acceptedActionIndex = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.ACTION_INDEX];
          const acceptedActionUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.ACTION_UUID];
          const beforeHash = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.BEFORE_HASH];
          const afterHash = data[shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.AFTER_HASH];

          pending_actions.delete( acceptedActionUuid );
          
                                                    
          if ( afterHash === hashes[ verifiedIndex + 1 ] ) {
              ++ verifiedIndex;
              updateSyncStatus();
              updateUndoRedoButtons();
              return;
          }

          if ( acceptedActionIndex < verifiedIndex ) {
              updateSyncStatus();
              updateUndoRedoButtons();
              return;
          }

          const actionIndex = history.findIndex(action => action[shared.MOD_ACTIONS.UUID] === acceptedActionUuid);
          if ( actionIndex === -1 ) {
              // Action not found in our history - request replay
              debugLog(`Accepted action ${acceptedActionUuid} not found in our history`);
              requestReplay( currentPageUuid, true );
              return;
          }
          if ( actionIndex < verifiedIndex ) {
              updateSyncStatus();
              updateUndoRedoButtons();
              return;
          }
          
          if ( actionIndex === acceptedActionIndex ) {
              verifiedIndex = actionIndex + 1;
              updateSyncStatus();
              updateUndoRedoButtons();
              return;
          }

          const afterIndex = hashes.indexOf( afterHash );
          const beforeIndex = hashes.indexOf( beforeHash );

          if ( afterIndex > verifiedIndex ) {
              debugLog(`found afterIndex=${afterIndex} with verifiedIndex=${verifiedIndex}`);
              verifiedIndex = afterIndex;
              updateSyncStatus();
              updateUndoRedoButtons();
              // if ( present < verifiedIndex ) { present = verifiedIndex-1; }
              return;
          }
          if ( beforeIndex >= verifiedIndex ) {
              debugLog(`found beforeIndex=${beforeIndex} with verifiedIndex=${verifiedIndex}`);
              verifiedIndex = beforeIndex;
              const [ action ] = history.splice( actionIndex, 1 );
              history.splice( verifiedIndex, 0, action );
              ++ verifiedIndex;
              hashes[ verifiedIndex ] = afterHash;
              updateSyncStatus();
              updateUndoRedoButtons();
              // if ( present < verifiedIndex ) { present = verifiedIndex-1; }
              return;              
          }

          if ( hashes[actionIndex] === beforeHash && hashes[actionIndex + 1] === afterHash) {
              verifiedIndex = actionIndex + 1;
              updateSyncStatus();
              updateUndoRedoButtons();
              if ( present < verifiedIndex ) { present = verifiedIndex; }
              return;
          }
          
          // const lastVerifiedHash = hashes[ verifiedIndex ];
          // const pastVerifiedIndex = verifiedIndex;
          // if ( beforeHash == lastVerifiedHash ) {
          //      const [ action ] = history.splice( actionIndex, 1 );
          //      history.splice( verifiedIndex, 0, action );
          //      hashes[ verifiedIndex ] = afterHash;
          //      ++ verifiedIndex;                                            
          //      updateSyncStatus();
          //      updateUndoRedoButtons();
          //      return;
          // } else {
          //     for ( let j = verifiedIndex; j < present; j++ ) {
          //         if ( beforeHash === shared.hashNext( lastVerifiedHash, history[ j ] ) ) {
          //             if ( j == actionIndex ) {
          //                 debugLog( "beforeHash should not match" );
          //             } else if ( j < actionIndex ) {
          //                 const [ action_one ] = history.splice( j, 1 );
          //                 history.splice( verifiedIndex, 0, action_one );
          //                 hashes[ verifiedIndex ] = beforeHash;
          //                 ++ verifiedIndex;
          //                 const [ action ] = history.splice( actionIndex, 1 );
          //                 history.splice( verifiedIndex, 0, action );
          //                 hashes[ verifiedIndex ] = afterHash;

          //             } else {

          //                 history.splice( verifiedIndex, 0, action_one );
          //                 hashes[ verifiedIndex ] = beforeHash;
          //                 ++ verifiedIndex;

          //             return;
          //         }
          //     }

          // Verify our computed hashes match the server:
          if (hashes[actionIndex] !== beforeHash || hashes[actionIndex + 1] !== afterHash) {
              // Hash mismatch - action was applied at different point in history
              debugLog(`Hash mismatch for action ${acceptedActionUuid}: client=${hashes[actionIndex]}/${hashes[actionIndex+1]} vs server=${beforeHash}/${afterHash}`);
              requestReplay( currentPageUuid, true );
              return;
          }

          // Hashes match - update verified index
          if (verifiedIndex <= actionIndex) {
              verifiedIndex = actionIndex + 1;
          }
          
          // Update UI
          updateSyncStatus();
          updateUndoRedoButtons();

      // Handle decline message from server
      function handleDeclineMessage(data) {
          const declinedActionUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.DECLINE.ACTION_UUID];
          const reason = data[shared.MESSAGES.SERVER_TO_CLIENT.DECLINE.REASON];
          
          pending_actions.delete( declinedActionUuid );

          console.error(`Server declined action ${declinedActionUuid}: ${reason}`);
          
          // Find the declined action in our history
          const actionIndex = history.findIndex(action => action[shared.MOD_ACTIONS.UUID] === declinedActionUuid);
          
          if (actionIndex !== -1) {
              // If the action is in our history, we need to remove it and all subsequent actions
              if (actionIndex >= verifiedIndex) {
                  // Only remove unverified actions
                  history = history.slice(0, verifiedIndex);
                  hashes = hashes.slice(0, verifiedIndex + 1);
                  present = verifiedIndex;
                  
                  // Update visual state
                  updateVisualState();
                  updateUndoRedoButtons();
              }
          }
          
          // Request replay to ensure we are in sync
          requestReplay( currentPageUuid, true );
      }
      
      // Handle replay message from server
      function handleReplayMessage(data, cache_only = false) {
          const pageUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.PAGE];
          const pageNumber = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.PAGE_NR];
          const pageTotal = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.TOTAL_PAGES];
          pagesMetaData[ pageUuid ] = [ pageNumber, pageTotal ];

          const beforeHash = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.BEFORE_HASH];
          const afterHash = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.AFTER_HASH];
          const replaySequence = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.SEQUENCE];
          const serverPresent = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.PRESENT];
          const currentHash = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.CURRENT_HASH];
          const do_switch = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.SWITCH];
          
          let pageData = null;
    
          if ( pageUuid !== currentPageUuid || cache_only ) {
              pageData = loadPageFromCache( pageUuid );
              if ( pageData ) {
                  pageData['hashes'] = [ shared.hashAny( pageUuid ) ];
                  for ( let i = 0; i < pageData['history'].length; ++ i ) {
                      pageData['hashes'].push( shared.hashNext( pageData['hashes'][ i ], pageData['history'][ i ] ) );
                  }
              } else {
                  requestFullPage(pageUuid, do_switch);
                  return null;                  
              }
          } else {
              pageData = {
                  history: history,
                  present: present,
                  hash: hashes[present],
                  hashes: hashes
              };
          }

          // Find index where replay should start (matching beforeHash)
          let startIndex = -1;
          for ( let i = 0; i < pageData['hashes'].length; i++ ) {
              if ( pageData['hashes'][i] === beforeHash ) {
                  startIndex = i;
                  break;
              }
          }

          debugLog("Replay paramters", {
              beforeHash: beforeHash,
              afterHash: afterHash,
              startIndex: startIndex,
              ourHashes: pageData['hashes']
          });
          

          if (startIndex === -1) {
              if (pageUuid === currentPageUuid && !cache_only) {
                  // The page on screen: ask for what is missing since our last confirmed
                  // state (the server falls back to page-info with snapshots if it does
                  // not know that state); the answer switches, so the view catches up now
                  debugLog("Replay hash not found in our chain, requesting a replay", { beforeHash });
                  requestReplay(currentPageUuid, true);
                  return null;
              }
              // Cannot find matching hash - need full page refresh
              debugLog("Replay hash not found in our chain, requesting full page", {
                  beforeHash,
                  ourHashes: pageData['hashes']
              });
              requestFullPage(pageUuid, do_switch);
              return null;
          }
          
          // Apply replay edits to the history
          if (replaySequence && replaySequence.length > 0) {
              // Remove any conflicting history after the replay point
              pageData['history'] = pageData['history'].slice(0, startIndex);
              pageData['hashes'] = pageData['hashes'].slice(0, startIndex + 1);
              
              // Add the replayed actions to history
              for (let i = 0; i < replaySequence.length; i++) {
                  const action = replaySequence[i];
                  pageData['history'].push(action);
                  
                  // Calculate new hash for each action
                  const lastHash = pageData['hashes'][pageData['hashes'].length - 1];
                  const newHash = shared.hashNext(lastHash, action);
                  pageData['hashes'].push(newHash);
              }
              
          }
          
          // Update present position
          pageData['present'] = serverPresent;
          
          // The replay continued our chain from beforeHash with the server's actions, so
          // it must arrive at the server's hash; a mismatch is a bug (or client and server
          // out of step), not something to paper over with a refetch
          if (pageData['hashes'][pageData['present']] !== currentHash) {
              throw new Error(`hash mismatch after replay on page ${pageUuid}: ours ${pageData['hashes'][pageData['present']]}, server's ${currentHash}`);
          }
          
          // Update cache with new state
          savePageToCache(pageUuid, {
              history: pageData['history'],
              present: pageData['present'],
              hash: pageData['hashes'][pageData['present']]
          });
          
           // (b) Page view — only if in page mode and this is our page
           if ( do_switch || currentPageUuid === pageUuid ) {
               currentPageUuid = pageUuid;
               history = pageData['history'];
               present = pageData['present'];
               hashes = pageData['hashes'];
               // Recompile visual state (always — needed even in overview mode
               // for when overview closes and the canvas is revealed)
               updateVisualState();
               // Update verified index to match present after replay
               verifiedIndex = present;
               // Update page info
               pageNr = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.PAGE_NR];
               totalPages = data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.TOTAL_PAGES];
               
               if ( !isOverviewActive() ) {
                   updatePageInfo();
                   updateSyncStatus();
                   updateUndoRedoButtons();
               }
           }
           debugLog("Replay applied successfully", pageData);

          // (c) Overview — if overview is visible
          refreshOverviewIfActive();

          return pageData;
      }
      
      // Track if we are in a cache verification cycle to avoid infinite loops
      // let cacheVerificationInProgress = false;
      
      // Handle full page message from server
      function handleFullPageMessage(data) {
          const do_switch = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.SWITCH];
          const pageUuid = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.PAGE];
          const pageHist = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.HISTORY];
          const pagePres = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.PRESENT];
          const page_nr = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.PAGE_NR];
          const n_pages = data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.TOTAL_PAGES];
          let pageHashes = [ shared.hashAny( pageUuid ) ];
          for ( let i = 0; i < pageHist.length; ++ i ) {
              pageHashes.push( shared.hashNext( pageHashes[ i ], pageHist[ i ] ) );
          }
          pagesMetaData[ pageUuid ] = [ page_nr, n_pages ];
          savePageToCache( pageUuid, {
              history: pageHist,
              present: pagePres,
              hash: pageHashes[pagePres]
          } );
          
           if ( do_switch ) {
               currentPageUuid = pageUuid;
               history = pageHist;
               present = pagePres;
               hashes = pageHashes;
               pageNr = page_nr;
               totalPages = n_pages;
               commitCurrentPage();
               verifiedIndex = present;
               
               // Recompile visual state (always — needed even in overview mode
               // for when overview closes and the canvas is revealed)
               updateVisualState();
               
               if ( ! isOverviewActive() ) {
                   // Update UI
                   updatePageInfo();
                   updateSyncStatus();
                   updateUndoRedoButtons();
                  
                  // Save current page position to settings
                  saveSettings();
              }
          }
          
          // (c) Overview — if overview is visible
          refreshOverviewIfActive();
      }
      
      // A switch to another page is on its way: requested with register, answer not
      // yet in. Meanwhile pings and board info that find us off the server's page do
      // not start a switch of their own (after a page deletion all three did, and the
      // replacement page was fetched three times). An answer can get lost, so it expires.
      const PAGE_SWITCH_TIMEOUT = 10000;
      let pageSwitch = { target: null, since: 0 };

      function notePageSwitch( pageUuid, do_register, delta = 0 ) {
          if ( do_register && delta === 0 && pageUuid !== currentPageUuid ) {
              pageSwitch = { target: pageUuid, since: Date.now() };
          }
      }

      // The page a switch is on its way to, or null
      function pageSwitchUnderWay() {
          if ( pageSwitch.target === null || pageSwitch.target === currentPageUuid ) return null;
          if ( Date.now() - pageSwitch.since > PAGE_SWITCH_TIMEOUT ) return null;
          return pageSwitch.target;
      }

      // Request a full page from the server
      function requestFullPage(pageId, do_register, delta = 0) {
          const requestId = createRequestId();
          
          const request = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.BOARD]: boardId
          };
          
          // if (pageId) {
              request[shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.PAGE] = pageId;
              request[shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.REGISTER] = do_register;
          // }
          
          request[shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.DELTA] = delta;
          request[shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.REQUEST_ID] = requestId;
          
          debugLog('Requesting full page', request);
          notePageSwitch( pageId, do_register, delta );
          sendMessage(request);
      }
      
      // Request a replay from the server
      function requestReplay( pageUuid = currentPageUuid, do_register = true ) {
          const requestId = createRequestId();
          notePageSwitch( pageUuid, do_register );
    
          touchPageInCache( pageUuid );
          const pageData = loadPageFromCache( pageUuid );
          if ( pageUuid !== currentPageUuid ) {
              const request = {
                  type: shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.TYPE,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.BOARD]: boardId,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PAGE]: pageUuid,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT]: pageData[ 'present' ],
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT_HASH]: pageData[ 'hash' ],
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REGISTER]: do_register,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REQUEST_ID]: requestId
              };
              debugLog('Requesting replay', request);
              sendMessage(request);
          } else {          
              const request = {
                  type: shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.TYPE,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.BOARD]: boardId,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PAGE]: currentPageUuid,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT]: verifiedIndex,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT_HASH]: hashes[verifiedIndex],
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REGISTER]: do_register,
                  [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REQUEST_ID]: requestId
              };
              debugLog('Requesting replay', request);
              sendMessage(request);
          }
      }
      
      // Request a replay from the server
      function requestPageInfo( pageUuid = currentPageUuid, do_register = true, delta = 0 ) {
          const requestId = createRequestId();
          touchPageInCache( pageUuid );
          const pageData = loadPageFromCache( pageUuid );
          const request = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.PAGE]: pageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.DELTA]: delta,
              [shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.REGISTER]: do_register,
              [shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.REQUEST_ID]: requestId
          };
          debugLog('Requesting page info', request);
          notePageSwitch( pageUuid, do_register, delta );
          sendMessage(request);
      }
      
      // Send a message to the server
      function sendMessage(message) {
          if (!connectionEstablished) {
              showError('Not connected to server.' + waitingEditsNote());
              return false;
          }
          
          debugLog('Sending message', message);
          ws.send(JSON.stringify(message));

      // Helper function to find pattern name from array

          if (!patternArray || patternArray.length === 0) return 'solid';
          
          // Compare array contents to find matching pattern
          for (const [name, pattern] of Object.entries(DASH_PATTERNS)) {
              if (pattern.length === patternArray.length && 
                  pattern.every((val, index) => val === patternArray[index])) {
                  return name;
              }
          }
          
          return 'solid'; // Default fallback

      // Discard pending property edits without committing to history.
      // The operation that follows (drag/cut/delete/layer-change) reads
      // the already-mutated elements from visualState, so its ERASE/DRAW
      // naturally includes the property changes in one undo entry.
      function clearPendingSelection() {
          selectionPendingMods = false;
          selectionOriginalUuids = [];
          selectionPendingOverrides = {};
      }

      // Selection Functions
      function clearSelection() {
          commitSelectionModifications();
          selectedElements = [];
          requestRedraw();
      }

      function calculateSelectionBounds() {
          if (selectedElements.length === 0) return null;
          
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          
          selectedElements.forEach(uuid => {
              const element = visualState.element.get(uuid);
              if (!element) return;
              
              const bounds = bounding_box(element);
              minX = Math.min(minX, bounds[0]);
              minY = Math.min(minY, bounds[1]);
              maxX = Math.max(maxX, bounds[2]);
              maxY = Math.max(maxY, bounds[3]);
          });
          
          return {
              x: minX,
              y: minY,
              width: maxX - minX,
              height: maxY - minY
          };
      }

      function findElementsIntersectingSelection(selectionStroke) {
          let result = [];
          
          for (const [uuid, element] of visualState.element) {
              if (visualState.visible.has(uuid) && 
                  visibleLayers.has(element[shared.ELEMENT.LAYER]) &&
                  do_intersect(element, selectionStroke)) {
                  result.push(uuid);
              }
          }
          
          return result;
      }

      function isClickOnSelectedElement(x, y) {
          const point = { x, y };
          
          for (const uuid of selectedElements) {
              const element = visualState.element.get(uuid);
              if (!element) continue;
              
              const bounds = bounding_box(element);
              if (x >= bounds[0] && x <= bounds[2] && y >= bounds[1] && y <= bounds[3]) {
                  // Do a more precise check if needed
                  return true;
              }
          }
          
          return false;
      }

      function startDragSelectedElements(x, y) {
          isDraggingSelection = true;
          selectionStartPoint = { x, y };
          selectionOriginalPoint = { x, y };
      }

      function dragSelectedElements(x, y) {
          if (!isDraggingSelection || !selectionStartPoint) return;
          
          // Update selection start point for calculating final movement
          selectionStartPoint = { x, y };
          
          // TODO: Could implement real-time preview of the drag here
      }

      function finishDragSelectedElements(x, y) {
          if (!isDraggingSelection) return;
          
          // Calculate total movement from original point
          const dx = x - selectionOriginalPoint.x;
          const dy = y - selectionOriginalPoint.y;
          
          // Apply movement to all selected elements
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
              dragMoveSelectedElements(dx, dy);
          }
          
          isDraggingSelection = false;
          selectionStartPoint = null;
          selectionOriginalPoint = null;
      }

      function dragMoveSelectedElements(dx, dy) {
          clearPendingSelection();
          // One flat group like Move: erase the originals, then draw the moved copies
          const erases = [];
          const draws = [];
          for (const uuid of selectedElements) {
              const element = visualState.element.get(uuid);
              if (!element) continue;
              
              // Create a new element, moved by its transform
              const newElement = JSON.parse(JSON.stringify(element));
              newElement[shared.ELEMENT.TRANSFORM] = translatedTransform(element[shared.ELEMENT.TRANSFORM], dx, dy);
              
              erases.push(createEraseAction(uuid));
              draws.push({
                  type: shared.MOD_ACTIONS.DRAW.TYPE,
                  [shared.MOD_ACTIONS.UUID]: shared.generateUuid(),
                  [shared.MOD_ACTIONS.DRAW.STROKE]: newElement
              });
          }
          
          const groupUuid = shared.generateUuid();
          const groupAction = {
              type: shared.MOD_ACTIONS.GROUP.TYPE,
              [shared.MOD_ACTIONS.UUID]: groupUuid,
              [shared.MOD_ACTIONS.GROUP.ACTIONS]: [...erases, ...draws]
          };
          
          // Add to history with the real hash, so client and server agree at once
          applyActionOptimistically(groupAction);
          
          // Create proposal
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: groupAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present - 1]
          };
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();
          
          // Send to server
          pending_register_action( groupUuid );
          sendMessage(proposal);
      }

      function copySelectedElements() {
          clipboard.elements = [];
          clipboard.bounds = calculateSelectionBounds();
          clipboard.sourceLayer = activeLayer;
          
          selectedElements.forEach(uuid => {
              const element = visualState.element.get(uuid);
              if (element) {
                  // Create a deep copy of the element
                  // Note: Elements do not contain UUIDs - UUIDs are only used as Map keys and in actions
                  // The element structure only contains drawable data (type, path, points, color, etc.)
                  const elementCopy = JSON.parse(JSON.stringify(element));
                  clipboard.elements.push(elementCopy);
              }
          });
          
          // Update paste button state
          updatePasteButton();
      }

      // Move: the selection itself goes into paste mode (the clipboard is left
      // alone). Committing erases the originals and draws the transformed copies
      // as one group, i.e. one undo step; cancelling leaves the page as it was.
      function moveSelectedElements() {
          clearPendingSelection();
          if (selectedElements.length === 0) return;
          const replaces = [...selectedElements];
          const elements = replaces.map(uuid => visualState.element.get(uuid)).filter(element => element);
          clearSelection();
          enterPasteMode(elements, replaces);
      }

      // Cancel button: leave paste mode without committing
      function cancelPaste() {
          if (!pasteMode) return;
          exitPasteMode();
      }

      function cutSelectedElements() {
          clearPendingSelection();
          if (selectedElements.length === 0) return;
          copySelectedElements();
          deleteSelectedElements();
          // updatePasteButton() already called by copySelectedElements()
      }

      function makeEraseAction ( selectedElements ) {
          const eraseActions = selectedElements.map(targetUuid => createEraseAction(targetUuid));
          const groupUuid = shared.generateUuid();
          const groupAction = {
              type: shared.MOD_ACTIONS.GROUP.TYPE,
              [shared.MOD_ACTIONS.UUID]: groupUuid,
              [shared.MOD_ACTIONS.GROUP.ACTIONS]: eraseActions
          };
          return groupAction;
      }

      function applyActionOptimistically ( action ) {
          // If we are in the middle of history (after undoing), truncate future actions
          if (present < history.length) {
              history = history.slice(0, present);
              hashes = hashes.slice(0, present + 1);
          }
          // The new action is unconfirmed: the confirmed prefix ends at present at most
          // (an accepted redo can leave verifiedIndex past the history until the next ping)
          verifiedIndex = Math.min(verifiedIndex, present);
          // Add to history and advance present
          history.push( action );
          // Calculate placeholder hash
          const nextHash = shared.hashNext( hashes[ present ], action ); 
          hashes.push( nextHash );
          present++;
       }

      function deleteSelectedElements() {
          clearPendingSelection();
          if (selectedElements.length === 0) return;
          
          // Create group of erase actions
          const groupAction = makeEraseAction( selectedElements );
          applyActionOptimistically( groupAction );

          // Clear selection
          clearSelection();
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();

          // Create proposal and send to server
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: groupAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present - 1]
          };
          pending_register_action( groupAction[shared.MOD_ACTIONS.UUID] );
          sendMessage(proposal);
      }

      // Update paste button state based on clipboard
      function updatePasteButton() {
          if (pasteBtn) {
              pasteBtn.disabled = clipboard.elements.length === 0;
          }
      }

      // Handle paste button click - enter interactive paste mode
      function handlePasteClick() {
          stopResetTool();
          if (!clipboard.elements.length) {
              return; // Button should be disabled, but just in case
          }
          
          // Enter paste mode
          enterPasteMode();
          startResetTool();
      }
      
      // Enter interactive paste mode, by default with the clipboard. A Move passes
      // the selected elements and their uuids: those are hidden while the preview
      // is shown and erased in the same group that draws the copies.
      function enterPasteMode(elements = clipboard.elements, replaces = []) {
          // Create preview elements at original coordinates
          pasteMode = true;
          pastedElements = [];
          pasteReplaces = replaces;
          document.getElementById('cancel-paste-btn').style.display = '';
          backgroundValid = false; // hide the elements a Move replaces

          // Create identity transform initially (elements at original position)
          pasteTransform = shared.createIdentityTransform();

          // Store elements with their UUIDs
          elements.forEach(element => {
              const uuid = shared.generateUuid();
              pastedElements.push({
                  uuid: uuid,
                  originalElement: element
              });
          });
          
          // Calculate bounds of pasted elements
          pasteBounds = calculatePasteBounds();
          
          // Initialize control triangle
          initializeControlTriangle();
          
          // Redraw to show pasted elements
          requestRedraw();
      }
      
      // Calculate bounds of pasted elements with current transform
      function calculatePasteBounds() {
          if (pastedElements.length === 0) return null;
          
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          
          pastedElements.forEach(({originalElement}) => {
              // Apply paste transform to get current bounds
              const transform = shared.compose(pasteTransform, originalElement[shared.ELEMENT.TRANSFORM]);
              const transformedPath = shared.applyTransformToPath(transform, originalElement[shared.ELEMENT.POINTS]);
              const boundaries = shared.bbox(transformedPath);
              const radius = originalElement[shared.ELEMENT.WIDTH] / 2;
              
              minX = Math.min(minX, boundaries[0] - radius);
              minY = Math.min(minY, boundaries[1] - radius);
              maxX = Math.max(maxX, boundaries[2] + radius);
              maxY = Math.max(maxY, boundaries[3] + radius);
          });
          
          return {
              x: minX,
              y: minY,
              width: maxX - minX,
              height: maxY - minY
          };
      }
      
      // Exit paste mode and commit the paste
      function commitPaste() {
          if (!pasteMode || pastedElements.length === 0) return;
          
          const actions = pastedElements.map(({uuid, originalElement}) => {
              const newElement = JSON.parse(JSON.stringify(originalElement));
              
              // Compose the paste transform with original transform
              newElement[shared.ELEMENT.TRANSFORM] = shared.compose(pasteTransform, originalElement[shared.ELEMENT.TRANSFORM]);

              // A paste goes to the active layer; a Move keeps each element's layer
              if (pasteReplaces.length === 0) {
                  newElement[shared.ELEMENT.LAYER] = Number(activeLayer);
              }

              // Create a draw action
              return {
                  type: shared.MOD_ACTIONS.DRAW.TYPE,
                  [shared.MOD_ACTIONS.UUID]: uuid,
                  [shared.MOD_ACTIONS.DRAW.STROKE]: newElement
              };
          });

          // A Move erases the originals in the same group, so it is one undo step
          actions.unshift(...pasteReplaces.map(uuid => createEraseAction(uuid)));

          // Group all paste actions
          const groupUuid = shared.generateUuid();
          const groupAction = {
              type: shared.MOD_ACTIONS.GROUP.TYPE,
              [shared.MOD_ACTIONS.UUID]: groupUuid,
              [shared.MOD_ACTIONS.GROUP.ACTIONS]: actions
          };
          
          // Add to history with the real hash, so client and server agree at once
          applyActionOptimistically(groupAction);
          
          // Create proposal
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: groupAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present - 1]
          };
          
          // Exit paste mode
          exitPasteMode();
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();
          
          // Send to server
          pending_register_action( groupUuid );
          sendMessage(proposal);
      }
      
      // Exit paste mode without committing
      function exitPasteMode() {
          pasteMode = false;
          pastedElements = [];
          pasteReplaces = [];
          document.getElementById('cancel-paste-btn').style.display = 'none';
          backgroundValid = false; // show the elements of a cancelled Move again
          pasteBounds = null;
          pasteTransform = null;
          isDraggingPaste = false;
          isResizingPaste = false;
          resizeHandle = null;
          dragStartPoint = null;
          initialTransform = null;
          controlTriangle = null;
          draggedHandle = null;
          transformMode = 'translate';
          requestRedraw();
      }

      function showMoveToLayerDialog() {
          // Simple implementation - directly move to active layer
          moveSelectedElementsToLayer(activeLayer);
      }

      function moveSelectedElementsToLayer(targetLayer) {
          if (selectedElements.length === 0) return;
          
          clearPendingSelection();
          
          // One flat group like Move: erase the originals, then draw the copies on the new layer
          const erases = [];
          const draws = [];
          for (const uuid of selectedElements) {
              const element = visualState.element.get(uuid);
              if (!element) continue;
              
              // If already on target layer, skip
              if (element[shared.ELEMENT.LAYER] === targetLayer) continue;
              
              // Create a new element with modified layer
              const newElement = JSON.parse(JSON.stringify(element));
              newElement[shared.ELEMENT.LAYER] = Number(targetLayer);
              
              erases.push(createEraseAction(uuid));
              draws.push({
                  type: shared.MOD_ACTIONS.DRAW.TYPE,
                  [shared.MOD_ACTIONS.UUID]: shared.generateUuid(),
                  [shared.MOD_ACTIONS.DRAW.STROKE]: newElement
              });
          }
          
          if (erases.length === 0) return;
          
          const groupUuid = shared.generateUuid();
          const groupAction = {
              type: shared.MOD_ACTIONS.GROUP.TYPE,
              [shared.MOD_ACTIONS.UUID]: groupUuid,
              [shared.MOD_ACTIONS.GROUP.ACTIONS]: [...erases, ...draws]
          };
          
          applyActionOptimistically(groupAction);
          
          // Create proposal
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: groupAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present - 1]
          };
          
          // Clear selection
          clearSelection();
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();
          
          // Send to server
          pending_register_action( groupUuid );
          sendMessage(proposal);
      }

      // Apply a property override to selected elements locally (no server proposal).
      // Multiple changes accumulate; only the final state is committed on deselection.
      function applySelectionProperty(overrides) {
          if (selectedElements.length === 0) return;

          // On first modification within this selection session, snapshot the uuids.
          if (!selectionPendingMods) {
              selectionPendingMods = true;
              selectionOriginalUuids = [...selectedElements];
              selectionPendingOverrides = {};
          }

          // Accumulate overrides for each selected element.
          for (const uuid of selectedElements) {
              if (!selectionPendingOverrides[uuid]) {
                  selectionPendingOverrides[uuid] = {};
              }
              const element = visualState.element.get(uuid);
              if (!element) continue;
              // Clone the element to avoid mutating the original that history references.
              // This ensures updateVisualState() can reconstruct the correct state.
              const clone = JSON.parse(JSON.stringify(element));
              if (overrides.color !== undefined) {
                  clone[shared.ELEMENT.COLOR] = overrides.color;
                  selectionPendingOverrides[uuid].color = overrides.color;
              }
              if (overrides.width !== undefined) {
                  clone[shared.ELEMENT.WIDTH] = overrides.width;
                  selectionPendingOverrides[uuid].width = overrides.width;
              }
              if (overrides.dash_pattern !== undefined) {
                  clone[shared.ELEMENT.DASH_PATTERN] = overrides.dash_pattern;
                  selectionPendingOverrides[uuid].dash_pattern = overrides.dash_pattern;
              }
              if (overrides.opacity !== undefined) {
                  clone[shared.ELEMENT.OPACITY] = overrides.opacity;
                  selectionPendingOverrides[uuid].opacity = overrides.opacity;
              }
              visualState.element.set(uuid, clone);
          }

          backgroundValid = false;
          requestRedraw();
      }

      // Commit all accumulated selection property modifications as a single flat proposal.
      function commitSelectionModifications() {
          if (!selectionPendingMods || selectionOriginalUuids.length === 0) {
              selectionPendingMods = false;
              selectionOriginalUuids = [];
              selectionPendingOverrides = {};
              return;
          }

          // Build one flat list of [ERASE(uuid1), ERASE(uuid2), ..., DRAW(newUuid1, modified1), ...]
          const actions = [];
          const newUuids = [];

          for (const uuid of selectionOriginalUuids) {
              // Erase the original
              actions.push(createEraseAction(uuid));
              // Draw the modified version
              const element = visualState.element.get(uuid);
              if (element) {
                  const newUuid = shared.generateUuid();
                  newUuids.push(newUuid);
                  actions.push({
                      type: shared.MOD_ACTIONS.DRAW.TYPE,
                      [shared.MOD_ACTIONS.UUID]: newUuid,
                      [shared.MOD_ACTIONS.DRAW.STROKE]: JSON.parse(JSON.stringify(element))
                  });
              }
          }

          if (actions.length === 0) {
              selectionPendingMods = false;
              selectionOriginalUuids = [];
              selectionPendingOverrides = {};
              return;
          }

          // Single flat GROUP — no nesting.
          const groupUuid = shared.generateUuid();
          const groupAction = {
              type: shared.MOD_ACTIONS.GROUP.TYPE,
              [shared.MOD_ACTIONS.UUID]: groupUuid,
              [shared.MOD_ACTIONS.GROUP.ACTIONS]: actions
          };

          applyActionOptimistically(groupAction);

          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: groupAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present - 1]
          };

          // Clear pending state BEFORE updateVisualState to prevent re-entrancy.
          selectionPendingMods = false;
          selectionOriginalUuids = [];
          selectionPendingOverrides = {};

          updateVisualState();
          selectedElements = newUuids;
          updateUndoRedoButtons();
          updateSyncStatus();

          pending_register_action(groupUuid);
          sendMessage(proposal);
          requestRedraw();
      }

      // Offline, undo and redo stay within the edits the server has not confirmed:
      // the server can only undo or redo at the top of its own history.
      function undoFloor() {
          return connectionEstablished ? 0 : verifiedIndex;
      }
      
      // Update undo/redo button states
      function updateUndoRedoButtons() {
          // Undo is available if we have actions in history before our present position
          undoBtn.disabled = present <= undoFloor();
          
          // Redo is available if we have actions in history after our present position
          redoBtn.disabled = present >= history.length || present < undoFloor();
      }
      
      // Handle undo action
      function handleUndo() {
          if (present <= undoFloor()) return;
          
          const actionToUndo = history[present - 1];
          const undoUuid = shared.generateUuid();
          
          const undoAction = {
              type: shared.MOD_ACTIONS.UNDO.TYPE,
              [shared.MOD_ACTIONS.UUID]: undoUuid,
              [shared.MOD_ACTIONS.UNDO.TARGET_ACTION]: actionToUndo[shared.MOD_ACTIONS.UUID]
          };
          
          // Create proposal
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: undoAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present]
          };
          
          // Apply locally first (optimistic update)
          present--;
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();
          
          // Send to server
          sendMessage(proposal);
      }
      
      // Handle redo action
      function handleRedo() {
          if (present >= history.length || present < undoFloor()) return;
          
          const actionToRedo = history[present];
          const redoUuid = shared.generateUuid();
          
          const redoAction = {
              type: shared.MOD_ACTIONS.REDO.TYPE,
              [shared.MOD_ACTIONS.UUID]: redoUuid,
              [shared.MOD_ACTIONS.REDO.TARGET_ACTION]: actionToRedo[shared.MOD_ACTIONS.UUID]
          };
          
          // Create proposal
          const proposal = {
              type: shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAGE]: currentPageUuid,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.PAYLOAD]: redoAction,
              [shared.MESSAGES.CLIENT_TO_SERVER.MOD_ACTION_PROPOSALS.BEFORE_HASH]: hashes[present]
          };
          
          // Apply locally first (optimistic update)
          present++;
          
          // Update visual state and UI
          updateVisualState();
          updateUndoRedoButtons();
          updateSyncStatus();
          
          // Send to server
          sendMessage(proposal);
      }
      
      // Hand tool pointer handler for panning
      const hand_pointer_handler = {
          down: (event) => {
              if (force_stylus && event.pointerType === "touch") return;
              
              const rect = canvas.getBoundingClientRect();
              const x = event.clientX - rect.left;
              const y = event.clientY - rect.top;
              
              isDraggingPaste = true; // Reuse flag
              dragStartPoint = { x, y, panX, panY };
          },
          move: (event) => {
              if (force_stylus && event.pointerType === "touch") return;
              if (!isDraggingPaste || !dragStartPoint) return;
              
              const rect = canvas.getBoundingClientRect();
              const x = event.clientX - rect.left;
              const y = event.clientY - rect.top;
              
              panX = dragStartPoint.panX + (x - dragStartPoint.x);
              panY = dragStartPoint.panY + (y - dragStartPoint.y);
              
              applyZoom();
              requestRedraw();
          },
          up: (event) => {
              startResetTool();
              if (force_stylus && event.pointerType === "touch") return;
              
              isDraggingPaste = false;
              dragStartPoint = null;
              saveSettings();
          }
      };
      
      // Set current tool
      function setTool(tool) {
          stopResetTool();
                                    
          // Commit paste if switching tools while in paste mode
          if (pasteMode) {
              commitPaste();
          }
          
          currentTool = tool;
          if ( tool.startsWith('pen') ) { 
              currentDefaultTool = tool; 
          }

          // Update UI - remove active from all tools
          document.getElementById('pen-slot-0').classList.remove('active');
          document.getElementById('pen-slot-1').classList.remove('active');
          document.getElementById('pen-slot-2').classList.remove('active');
          document.getElementById('pen-slot-3').classList.remove('active');
          document.getElementById('pen-slot-4').classList.remove('active');
          document.getElementById('pen-slot-5').classList.remove('active');
          document.getElementById('eraser-tool').classList.remove('active');
          document.getElementById('selection-rectangle-tool').classList.remove('active');
          document.getElementById('selection-lasso-tool').classList.remove('active');
          document.getElementById('selection-stroke-tool').classList.remove('active');
          document.getElementById('hand-tool').classList.remove('active');
          document.getElementById('paste-btn').classList.remove('active');
          // document.getElementById(`${tool}-tool`).classList.add('active');
          
          // Clear selection when switching away from selection tools
          const isSelectionTool = (tool === 'selection-rectangle' || tool === 'selection-lasso' || tool === 'selection-stroke');
          if (!isSelectionTool) {
              clearSelection();
              isDeselectMode = false;
              deselectToggleBtn.classList.remove('active');
          } else {
              // Switching between selection tools: commit pending mods, keep selection
              commitSelectionModifications();
          }

          // Update cursor
          switch (tool) {
          case 'pen1':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen1_settings );
              set_pointer_handler( shape_to_ph( pen1_settings.shape ) );
              document.getElementById('pen-slot-0').classList.add('active');
              break;
          case 'pen2':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen2_settings );
              set_pointer_handler( shape_to_ph( pen2_settings.shape ) );
              document.getElementById('pen-slot-1').classList.add('active');
              break;
          case 'pen3':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen3_settings );
              set_pointer_handler( shape_to_ph( pen3_settings.shape ) );
              document.getElementById('pen-slot-2').classList.add('active');
              break;
          case 'pen4':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen4_settings );
              set_pointer_handler( shape_to_ph( pen4_settings.shape ) );
              document.getElementById('pen-slot-3').classList.add('active');
              break;
          case 'pen5':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen5_settings );
              set_pointer_handler( shape_to_ph( pen5_settings.shape ) );
              document.getElementById('pen-slot-4').classList.add('active');
              break;
          case 'pen6':
              canvas.style.cursor = 'crosshair';
              switch_settings( pen6_settings );
              set_pointer_handler( shape_to_ph( pen6_settings.shape ) );
              document.getElementById('pen-slot-5').classList.add('active');
              break;
          case 'eraser':
              canvas.style.cursor = 'cell';
              switch_settings( eraser_settings );
              set_pointer_handler( erase_path_pointer_handler );
              document.getElementById('eraser-tool').classList.add('active');
              break;
          case 'selection-rectangle':
              canvas.style.cursor = 'crosshair';
              switch_settings( selection_rectangle_settings );
              set_pointer_handler( selection_pointer_handler );
              document.getElementById('selection-rectangle-tool').classList.add('active');
              break;
          case 'selection-lasso':
              canvas.style.cursor = 'crosshair';
              switch_settings( selection_lasso_settings );
              set_pointer_handler( selection_pointer_handler );
              document.getElementById('selection-lasso-tool').classList.add('active');
              break;
          case 'selection-stroke':
              canvas.style.cursor = 'crosshair';
              switch_settings( selection_stroke_settings );
              set_pointer_handler( selection_pointer_handler );
              document.getElementById('selection-stroke-tool').classList.add('active');
              break;
          case 'paste':
              canvas.style.cursor = 'crosshair';
              switch_settings( paste_settings );
              if (paste_settings.pasteMode === 'place') {
                  if (clipboard.elements.length > 0) {
                      enterPasteMode();
                  }
                  set_pointer_handler( paste_pointer_handler );
              } else {
                  set_pointer_handler( paste_shape_pointer_handler );
              }
              document.getElementById('paste-btn').classList.add('active');
              break;
          case 'hand':
              canvas.style.cursor = 'grab';
              set_pointer_handler( hand_pointer_handler );
              document.getElementById('hand-tool').classList.add('active');
              break;
          }
      }
      
      // Adjust zoom level
      function adjustZoom(delta) {
          zoomLevel = Math.max(0.5, Math.min(3, zoomLevel + delta));
          zoomLevelDisplay.textContent = `${Math.round(zoomLevel * 100)}%`;
          applyZoom();
          requestRedraw();
          saveSettings();
      }
      
      // Reset view to default (center, 100% zoom)
      function resetView() {
          zoomLevel = 1;
          panX = 0;
          panY = 0;
          zoomLevelDisplay.textContent = '100%';
          applyZoom();
          requestRedraw();
          saveSettings();
      }
      
      // Update page info display
      function updatePageInfo() {
          pageInfo.textContent = `Page ${pageNr} of ${totalPages}`;
      }
      
      const draw_path_pointer_handler = {
          down: (event) => {
              if ( force_stylus && event.pointerType === "touch" ) { return; }
              const rect = canvas.getBoundingClientRect();
              const x = (event.clientX - rect.left - panX) / zoomLevel;
              const y = (event.clientY - rect.top - panY) / zoomLevel;
              const pressure = event.pressure !== undefined ? event.pressure : 0.5;
              currentPath = [];
              const point = shared.createPoint(x, y, pressure);
              currentPath.push(point);
              isDrawing = true;
              currentStroke = createStroke( draw_settings );
              if ( draw_settings.loop ) {
                  currentStroke[shared.ELEMENT.PATH] = shared.DRAWABLE.PATH.CLOSED_PIECEWISE_LINEAR;
              } else {
                  currentStroke[shared.ELEMENT.PATH] = shared.DRAWABLE.PATH.OPEN_PIECEWISE_LINEAR;
              }
              if ( draw_settings.fill ) {
                  currentStroke[shared.ELEMENT.TYPE] = shared.DRAWABLE.TYPE.FILL;
              } else {
                  currentStroke[shared.ELEMENT.TYPE] = shared.DRAWABLE.TYPE.STROKE;
              }
              currentStroke[shared.ELEMENT.COLOR] = draw_settings.color;
              currentStroke[shared.ELEMENT.WIDTH] = draw_settings.width / zoomLevel;
              currentStroke[shared.ELEMENT.OPACITY] = draw_settings.opacity;
              currentStroke[shared.ELEMENT.POINTS] = currentPath;
          },
          move: (event) => {
              if ( force_stylus && event.pointerType === "touch" ) { return; }
              if (!isDrawing) return;
              const rect = canvas.getBoundingClientRect();
              const x = (event.clientX - rect.left - panX) / zoomLevel;
              const y = (event.clientY - rect.top - panY) / zoomLevel;
              const pressure = event.pressure !== undefined ? event.pressure : 0.5;
              const point = shared.createPoint(x, y, pressure);
              currentPath.push(point);
              currentStroke[shared.ELEMENT.POINTS] = currentPath;
              requestRedraw();
          },
          up: (event) => {
              if ( force_stylus && event.pointerType === "touch" ) { return; }
              if (isDrawing) {
                  isDrawing = false;
                  if (currentPath.length >= 1) {
                      const actionId = sendDrawAction(currentStroke);
                      if ( draw_settings.undo ) {
                          setTimeout( sendGroupEraseAction, 3000, [ actionId ] );
                      }
                  }
              }
