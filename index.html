<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0078d7">
    <link rel="manifest" href="/manifest.json">
    <title>Whiteboard App</title>
    <style>
      body {
          margin: 0;
          padding: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          overflow: hidden;
          display: flex;
          flex-direction: column;
      }
      
      .toolbar {
          display: flex;
          background-color: #f0f0f0;
          padding: 5px;
          border-bottom: 1px solid #ccc;
      }
      
      .tool-section {
          display: flex;
          align-items: center;
          margin-right: 10px;
          padding-right: 10px;
          border-right: 1px solid #ddd;
      }

      .tool-btn {
          width: 30px;
          height: 30px;
          margin: 0 2px;
					cursor: pointer;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 0;
					border: 3px solid #f0f0f0;
					background-color: #f0f0f0;
					border-radius: 4px;
					font-weight: bold;
      }
      
      .tool-btn:hover {
          background-color: #e0e0e0;
      }
      
      .tool-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
      }
      
      .tool-btn.active {
          border: 3px solid transparent;
          background-color: #d0d0d0;
      }
      
      .shape-btn {
          width: 30px;
          height: 30px;
          margin: 0 2px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          border: 3px solid #f0f0f0;
          background-color: #f0f0f0;
          border-radius: 4px;
          font-weight: bold;
      }
      
      .shape-btn:hover {
          background-color: #e0e0e0;
      }

      .shape-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
      }
      
      .shape-btn.active {
          border: 3px solid transparent;
          background-color: #808080;
      }
      
      .color-swatch {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          margin: 3px;
          cursor: pointer;
          border: 1px solid #ccc;
      }
      
      .color-swatch.active {
          width: 12px;
          height: 12px;
          /* border-color: #333; */
          /* border-width: 6px; */
      }
      
      /* Base slider styles */
      input[type="range"] {
          -webkit-appearance: none;
          width: 100px; /* Swap width and height for vertical layout */
          height: 8px;
          background: #d3d3d3;
          outline: none;
          opacity: 0.7;
          transition: opacity .2s;
      }
      
      input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          border-radius: 50%;
          background: var(--thumb-color, black);
          cursor: pointer;
          width: calc(var(--thumb-size, 2) * 2px); 
          height: calc(var(--thumb-size, 2) * 2px);
      }
      
      input[type="range"]::-moz-range-thumb {
          border: none;
          border-radius: 50%;
          background: var(--thumb-color, black);
          cursor: pointer;
          width: calc(var(--thumb-size, 2) * 2px);
          height: calc(var(--thumb-size, 2) * 2px);
      }
      
      /* Specific styles for the opacity slider */
      #opacity-selector {
          background: #fff;
      }
      
      #opacity-selector::-webkit-slider-thumb {
          width: 24px;
          height: 24px;
          background: black;
          /* background: var(--thumb-color); */
          opacity: var(--thumb-opacity, 1);
      }
      
      #opacity-selector::-moz-range-thumb {
          width: 24px;
          height: 24px;
          background: black;
          /* background: var(--thumb-color); */
          filter: opacity( var(--thumb-opacity, 1));
      }
      
      #debug-tools {
          margin-left: auto;
      }

      #layer-controls {
          margin-left: auto;
      }

      .app-container {
          display: flex;
          flex-grow: 1;
      }
      
      .sidebar {
          width: 50px; /* Reduced width for a more compact sidebar */
          background-color: #f0f0f0;
          /* border-right: 0px solid #ccc; */
          padding: 4px 0px;
          display: flex;
          flex-direction: column;
          align-items: center;
      }

      .sidebar-section {
          width: 100%;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center; /* Center content within each section */
          padding: 4px 0px;
          margin-bottom: 1px;
          border-bottom: 1px solid #ddd;
      }
      
      .sidebar-section:last-child {
          border-bottom: none;
      }
      
      #width-selection, #opacity-selection {
          /* Apply styles to the individual slider sections */
          height: 120px; /* Give the containers enough space to hold the rotated sliders */
          justify-content: center;
      }
      
      #width-selector, #opacity-selector {
          transform: rotate(90deg); /* Rotate the sliders */
          transform-origin: 50% 50%; /* Ensure rotation is centered */
      }
      
      .main-content {
          flex-grow: 1;
          display: flex;
          overflow: hidden;
      }
      
      #canvas-container {
          position: relative;
          flex: 1;
      }
      
      canvas {
          position: absolute;
          background-color: white;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          cursor: crosshair;
      }
      
      .page-controls {
          display: flex;
          align-items: center;
      }
      
      #page-info {
          margin: 0 10px;
          padding: 5px 10px;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          cursor: pointer;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      #page-info:hover {
          background-color: #e0e0e0;
      }
      
      .error-banner {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          background-color: #f44336;
          color: white;
          padding: 15px;
          text-align: center;
          z-index: 1000;
          display: none;
      }
      
      .error-banner button {
          margin-left: 15px;
          background-color: white;
          color: #f44336;
          border: none;
          padding: 5px 10px;
          cursor: pointer;
          border-radius: 4px;
      }
      
      .tooltip {
          position: relative;
          display: inline-block;
      }
      
      .tooltip .tooltiptext {
          visibility: hidden;
          width: 120px;
          background-color: #555;
          color: #fff;
          text-align: center;
          border-radius: 6px;
          padding: 5px;
          position: absolute;
          z-index: 1;
          bottom: 125%;
          left: 50%;
          margin-left: -60px;
          opacity: 0;
          transition: opacity 0.3s;
          font-size: 12px;
      }
      
      .tooltip:hover .tooltiptext {
          visibility: visible;
          opacity: 1;
      }
      
      /* Simple Color Picker Styles */
      #simple-color-picker {
          position: fixed;
          z-index: 1000;
          background: white;
          border: 1px solid #ccc;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0,0,0,0.2);
          padding: 10px;
          width: 260px;
          display: none;
      }
      
      #simple-color-picker-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
          border-bottom: 1px solid #eee;
          padding-bottom: 5px;
      }
      
      #simple-color-picker-title {
          font-weight: bold;
          margin: 0;
      }
      
      #simple-color-picker-close {
          background: none;
          border: none;
          font-size: 18px;
          cursor: pointer;
          padding: 2px 5px;
      }
      
      #color-grid {
          display: grid;
          grid-template-columns: repeat(8, 1fr);
          gap: 4px;
          margin-bottom: 10px;
      }
      
      .color-cell {
          width: 25px;
          height: 25px;
          border-radius: 3px;
          cursor: pointer;
          border: 1px solid #ccc;
      }
      
      .color-cell:hover {
          transform: scale(1.1);
      }
      
      #color-preview {
          height: 30px;
          border-radius: 4px;
          border: 1px solid #ccc;
          margin-bottom: 10px;
          display: flex;
      }
      
      #new-color {
          flex: 3;
          height: 100%;
      }
      
      #original-color {
          flex: 1;
          height: 100%;
          border-left: 1px solid #ccc;
      }
      
      #color-controls {
          display: flex;
          justify-content: space-between;
          margin-top: 10px;
      }
      
      #color-picker-actions {
          display: flex;
          gap: 5px;
      }
      
      #color-picker-actions button {
          padding: 5px 10px;
          border-radius: 4px;
          cursor: pointer;
      }
      
      #color-picker-apply {
          background-color: #4CAF50;
          color: white;
          border: none;
      }
      
      #color-picker-cancel {
          background-color: #f1f1f1;
          border: 1px solid #ccc;
      }
      
      #hex-input {
          padding: 5px;
          width: 80px;
          border: 1px solid #ccc;
          border-radius: 4px;
      }
      
      /* layers */
      .layer-grid {
          display: flex;
          flex-direction: column;
          gap: 2px;
      }
      
      .visibility-row, .active-row {
          display: flex;
          gap: 5px;
      }
      
      .layer-visibility-btn, .layer-active-btn {
          width: 12px;
          height: 12px;
          padding: 0;
          font-size: 9px;
          border: 1px solid #ccc;
          background-color: #f0f0f0;
          cursor: pointer;
          border-radius: 3px;
      }
      
      /* Visibility button styling */
      .layer-visibility-btn {
          opacity: 0.5;
      }
      
      .layer-visibility-btn.active {
          opacity: 1;
          background-color: #e6e6e6;
          border-color: #999;
      }
      
      /* Active layer button styling */
      .layer-active-btn {
          background-color: #f0f0f0;
      }
      
      .layer-active-btn.active {
          background-color: #3498db;
          color: white;
          border-color: #2980b9;
      }
      
      /* Visual indicator to distinguish rows */
      .visibility-row {
          border-bottom: 1px dotted #ccc;
          padding-bottom: 2px;
      }
      
      /* Selection tool specific styles */
      .selection-handle {
          width: 8px;
          height: 8px;
          background-color: white;
          border: 1px solid #0078d7;
          position: absolute;
          cursor: pointer;
      }
      
      /* Icons (see ICONS in the script) */
      .icon {
          display: inline-flex;
          align-items: center;
          vertical-align: middle;
      }

      .icon svg {
          display: block;
      }

      .icon + .icon-label {
          margin-left: 6px;
      }

      /* Boards View: a full-window page that scrolls, with a sticky top bar */
      #boards-view {
          position: fixed;
          inset: 0;
          z-index: 3000;
          display: none;
          overflow-y: auto;
          background-color: #f4f4f4;
          font-size: 14px;
      }

      #boards-view.visible {
          display: block;
      }

      body.boards-active .toolbar,
      body.boards-active .sidebar,
      body.boards-active .app-container {
          display: none;
      }

      #boards-topbar {
          position: sticky;
          top: 0;
          z-index: 1;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 8px 16px;
          padding: 10px 16px;
          background-color: #fff;
          border-bottom: 1px solid #ddd;
          box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }

      #boards-topbar h2 {
          margin: 0;
          font-size: 18px;
      }

      .boards-topbar-right {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
      }

      #boards-user {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          color: #555;
          margin-right: 4px;
      }

      .boards-btn {
          display: inline-flex;
          align-items: center;
          padding: 6px 12px;
          border: 1px solid #ccc;
          border-radius: 4px;
          background: #fff;
          cursor: pointer;
          font-size: 14px;
          font-family: inherit;
      }

      .boards-btn:hover {
          background: #f0f0f0;
      }

      .boards-section {
          margin: 16px;
          padding: 16px;
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 6px;
      }

      .boards-section h3 {
          margin: 0 0 12px 0;
          font-size: 16px;
          color: #333;
      }

      .boards-row {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
      }

      .boards-row + .boards-row {
          margin-top: 10px;
      }

      .boards-row input[type=text], .boards-row input[type=password], .boards-row input[type=search] {
          flex: 1 1 220px;
          min-width: 0;
          padding: 8px 10px;
          border: 1px solid #ccc;
          border-radius: 4px;
          font-size: 14px;
      }

      .boards-row input:focus {
          outline: none;
          border-color: #0078d7;
      }

      .board-nav-btn {
          display: inline-flex;
          align-items: center;
          padding: 8px 16px;
          border: none;
          border-radius: 4px;
          font-size: 14px;
          cursor: pointer;
          background-color: #0078d7;
          color: white;
      }

      .board-nav-btn:hover {
          background-color: #005a9e;
      }

      .board-nav-btn:disabled {
          background-color: #ccc;
          cursor: not-allowed;
      }

      .board-nav-feedback {
          display: block;
          margin-top: 8px;
          color: #c62828;
          font-size: 13px;
      }

      .board-nav-feedback:empty {
          display: none;
      }

      .board-nav-feedback.ok {
          color: #2e7d32;
      }

      .current-board-path {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 12px;
          font-size: 15px;
          font-weight: 500;
          overflow-wrap: anywhere;
      }

      .boards-hint {
          color: #888;
          margin: 0 0 12px 0;
      }

      /* The file tree */
      #board-tree {
          margin-top: 12px;
          border-top: 1px solid #eee;
      }

      .tree-row {
          display: flex;
          align-items: center;
          gap: 6px;
          min-height: 36px;
          padding: 2px 8px 2px calc(8px + var(--depth, 0) * 22px);
          border-bottom: 1px solid #f0f0f0;
      }

      .tree-row:hover {
          background-color: #fafafa;
      }

      .tree-row.folder {
          cursor: pointer;
      }

      .tree-row.current {
          background-color: #e8f1fb;
      }

      .tree-toggle {
          display: inline-flex;
          width: 18px;
          justify-content: center;
          color: #666;
          flex-shrink: 0;
      }

      .tree-name {
          flex: 1;
          min-width: 0;
          display: flex;
          align-items: center;
          gap: 6px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
      }

      .tree-date {
          color: #999;
          font-size: 12px;
          white-space: nowrap;
      }

      .tree-actions {
          display: flex;
          gap: 4px;
          flex-shrink: 0;
      }

      .tree-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 30px;
          height: 30px;
          padding: 0;
          border: 1px solid #ddd;
          border-radius: 4px;
          background: #fff;
          color: #333;
          cursor: pointer;
      }

      .tree-btn:hover {
          background: #f0f0f0;
      }

      .tree-edit {
          flex: 1;
          min-width: 0;
          padding: 5px 8px;
          border: 1px solid #0078d7;
          border-radius: 4px;
          font-size: 14px;
      }

      .tree-empty {
          padding: 14px 8px;
          color: #999;
      }

      /* Phones: less indentation, no date, and the buttons wrap below a name that
         would get narrower than 140 px */
      @media (max-width: 600px) {
          .boards-section {
              margin: 10px 8px;
              padding: 12px;
          }
          .tree-row {
              flex-wrap: wrap;
              padding-left: calc(4px + var(--depth, 0) * 12px);
          }
          .tree-name {
              flex: 1 1 140px;
          }
          .tree-date {
              display: none;
          }
          .tree-actions {
              margin-left: auto;
          }
      }

      /* Shape popup menu - horizontal */
      #shape-popup-menu, #path-mode-popup-menu, #cap-style-popup-menu, #join-style-popup-menu, #dash-pattern-popup-menu {
          position: fixed;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          padding: 4px;
          display: flex;
          flex-direction: row;
          gap: 2px;
          z-index: 1000;
          box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      
      /* Sensitivity popup slider */
      #sensitivity-popup {
          position: fixed;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          padding: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
          z-index: 1000;
          box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      
      #sensitivity-slider {
          width: 150px;
      }
      
      #sensitivity-value {
          min-width: 20px;
          font-weight: bold;
      }
      
      #paste-copies-selection, #paste-copies-x-selection, #paste-copies-y-selection {
          height: 180px;
          justify-content: flex-end;
      }
      
      #paste-copies-slider, #paste-copies-x-slider, #paste-copies-y-slider {
          width: 8px;
          height: 160px;
          -webkit-appearance: slider-vertical;
          appearance: slider-vertical;
          writing-mode: bt-lr;
      }
      
      /* Zoom popup menu */
      #zoom-popup-menu {
          position: fixed;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          padding: 4px;
          display: flex;
          flex-direction: column;
          gap: 2px;
          z-index: 1000;
          box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      
      #zoom-popup-menu .popup-option {
          width: 100px;
          height: 28px;
          margin: 0;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 8px;
          border: none;
          background-color: transparent;
          border-radius: 3px;
          font-size: 13px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      #zoom-popup-menu .popup-option:hover {
          background-color: #e0e0e0;
      }
      
      #zoom-popup-menu .popup-option:disabled {
          color: #999;
          cursor: not-allowed;
      }
      
      #zoom-popup-menu .popup-option:disabled:hover {
          background-color: transparent;
      }
      
      .popup-separator {
          height: 1px;
          background-color: #ccc;
          margin: 2px 4px;
      }
      
      /* Format popup menu */
      #format-popup-menu {
          position: fixed;
          background-color: #f0f0f0;
          border: 1px solid #ccc;
          border-radius: 4px;
          padding: 4px;
          display: flex;
          flex-direction: column;
          gap: 2px;
          z-index: 1000;
          box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      
      #format-popup-menu .popup-option {
          width: 100px;
          height: 28px;
          margin: 0;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 8px;
          border: none;
          background-color: transparent;
          border-radius: 3px;
          font-size: 13px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      #format-popup-menu .popup-option:hover {
          background-color: #e0e0e0;
      }
      
      /* Fixed widths for menu buttons to prevent layout jitter */
      #zoom-menu-btn {
          min-width: 6ch;
          text-align: center;
      }
      
      #format-menu-btn {
          min-width: 12ch;
          text-align: center;
      }
      
      #page-info {
          min-width: 16ch;
          text-align: center;
      }
      
      /* Page Overview Mode */
      #page-overview {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #2d2d2d;
          display: none;
          flex-direction: column;
          z-index: 3000;
      }
      
      #page-overview.visible {
          display: flex !important;
      }
      
      #overview-topbar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1em;
          padding: 0.5em;
          background-color: #444;
          flex-shrink: 0;
      }
      
      .overview-topbar-left, .overview-topbar-right {
          display: flex;
          gap: 0.5em;
      }
      
      .overview-btn {
          padding: 0.4em 1.2em;
          border: none;
          border-radius: 4px;
          font-size: 1em;
          cursor: pointer;
          font-family: inherit;
      }
      
      .overview-btn.confirm {
          background-color: #4CAF50;
          color: white;
      }
      
      .overview-btn.confirm:hover {
          background-color: #45a049;
      }
      
      .overview-btn.cancel {
          background-color: #888;
          color: white;
      }
      
      .overview-btn.cancel:hover {
          background-color: #666;
      }
      
      #overview-grid {
          flex: 1;
          overflow-y: auto;
          padding: 1em;
          display: flex;
          flex-wrap: wrap;
          align-content: flex-start;
          gap: 1em;
          justify-content: center;
      }
      
      .overview-thumb {
          width: calc((100% - 11em) / 6);
          background-color: #fff;
          border-radius: 4px;
          padding: 0.5em;
          cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,0.3);
          transition: box-shadow 0.15s;
          user-select: none;
      }
      
      .overview-thumb:hover {
          box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      }
      
      .overview-thumb.selected {
          outline: 3px solid #4CAF50;
          outline-offset: 2px;
      }
      
      .overview-thumb.drag-over {
          outline: 3px dashed #0078d7;
          outline-offset: 2px;
      }
      
      .overview-thumb {
          position: relative;
      }
       
      .overview-thumb canvas {
          position: static;
          width: 100%;
          height: auto;
          display: block;
          background-color: #fff;
          border-radius: 2px;
      }
       
      .overview-thumb-spinner {

      let dummyStorage = {};

      function saveItem(key, value) {
          try {
              const existingIndex = lruOrder.indexOf(key);
              if (existingIndex !== -1) {
                  lruOrder.splice(existingIndex, 1);
              }
              
              lruOrder.push(key);
              
              while (lruOrder.length > LRU_MAX_SIZE) {
                  const lruKey = lruOrder.shift();
                  delete dummyStorage[ lruKey ];
              }
              
              dummyStorage[ key ] = value;

              return true;
          } catch (e) {
              console.error('Error saving item to LRU cache:', e);
              return false;
          }
      }
      
      function loadItem(key) {
          try {
              const itemData = dummyStorage[ key ];
              if ( itemData === undefined || itemData === null ) {
                  return null;
              }
              
              const existingIndex = lruOrder.indexOf(key);
              if ( existingIndex !== -1 ) {
                  lruOrder.splice(existingIndex, 1);
                  lruOrder.push(key);
              }
              
              return itemData;
          } catch (e) {
              console.error('Error loading item from LRU cache:', e);
              return null;
          }
      }
      
      function removeItem(key) {
          try {
              if ( dummyStorage[key] === undefined || dummyStorage[ key ] === null ) {
                  return false;
              }
              
              delete dummyStorage[ key ];

              const index = lruOrder.indexOf(key);
              if (index !== -1) {
                  lruOrder.splice(index, 1);
              }
              
              return true;
          } catch (e) {
              console.error('Error removing item from LRU cache:', e);
              return false;
          }
      }


      function debugLog(msg, data = null) {
          console.log(`[DEBUG] ${msg}`, data || '');
      }

      // Settings persistence (board-specific)
      function getSettingsStorageKey() {
          return `whiteboard_settings_${boardId}`;
      }
      
      function saveSettings() {
          if (!boardId) return; // Cannot save without boardId
          
          try {
              const settings = {
                  pen1: pen1_settings,
                  pen2: pen2_settings,
                  pen3: pen3_settings,
                  pen4: pen4_settings,
                  pen5: pen5_settings,
                  pen6: pen6_settings,
                  eraser: eraser_settings,
                  selectionRectangle: selection_rectangle_settings,
                  selectionLasso: selection_lasso_settings,
                  selectionStroke: selection_stroke_settings,
                  activeLayer: activeLayer,
                  lastTool: currentTool,
                  zoomLevel: zoomLevel,
                  panX: panX,
                  panY: panY,
                  colorSwatches: [],
                  canvasFormat: canvasFormat,
              paste: paste_settings,
              // Page position
              currentPageUuid: currentPageUuid,
              pageNr: pageNr,
              totalPages: totalPages
              };
              
              // Save color swatch customizations
              document.querySelectorAll('.color-swatch').forEach(swatch => {
                  settings.colorSwatches.push({
                      color: swatch.dataset.color,
                      backgroundColor: swatch.style.backgroundColor
                  });
              });
              
              localStorage.setItem(getSettingsStorageKey(), JSON.stringify(settings));
              debugLog('Settings saved', { boardId });
          } catch (err) {
              console.warn('Failed to save settings:', err);
          }
      }
      
      function loadSettings() {
          if (!boardId) return false; // Cannot load without boardId
          
          try {
              const saved = localStorage.getItem(getSettingsStorageKey());
              if (!saved) return false;
              
              const settings = JSON.parse(saved);
              
              // Restore tool settings
              if (settings.pen1) Object.assign(pen1_settings, settings.pen1);
              if (settings.pen2) Object.assign(pen2_settings, settings.pen2);
              if (settings.pen3) Object.assign(pen3_settings, settings.pen3);
              if (settings.pen4) Object.assign(pen4_settings, settings.pen4);
              if (settings.pen5) Object.assign(pen5_settings, settings.pen5);
              if (settings.pen6) Object.assign(pen6_settings, settings.pen6);
              if (settings.eraser) Object.assign(eraser_settings, settings.eraser);
              if (settings.selectionRectangle) Object.assign(selection_rectangle_settings, settings.selectionRectangle);
              if (settings.selectionLasso) Object.assign(selection_lasso_settings, settings.selectionLasso);
              if (settings.selectionStroke) Object.assign(selection_stroke_settings, settings.selectionStroke);
              if (settings.paste) Object.assign(paste_settings, settings.paste);
              
              // Restore color swatches
              if (settings.colorSwatches) {
                  const swatches = document.querySelectorAll('.color-swatch');
                  settings.colorSwatches.forEach((swatch, index) => {
                      if (swatches[index]) {
                          swatches[index].dataset.color = swatch.color;
                          swatches[index].style.backgroundColor = swatch.backgroundColor;
                      }
                  });
              }
              
              // Restore active layer
              if (settings.activeLayer !== undefined) {
                  activeLayer = settings.activeLayer;
                  document.querySelectorAll('.layer-active-btn').forEach(btn => {
                      btn.classList.remove('active');
                      if (parseInt(btn.getAttribute('data-layer')) === activeLayer) {
                          btn.classList.add('active');
                      }
                  });
              }
              
              // Restore canvas format
              if (settings.canvasFormat !== undefined) {
                  canvasFormat = settings.canvasFormat;
                  updateFormatButton();
              }
              
              // Restore zoom level
              if (settings.zoomLevel !== undefined) {
                  zoomLevel = settings.zoomLevel;
                  zoomLevelDisplay.textContent = `${Math.round(zoomLevel * 100)}%`;
              }
              
              // Restore pan position
              if (settings.panX !== undefined) panX = settings.panX;
              if (settings.panY !== undefined) panY = settings.panY;

      // Compute affine transformation from control triangle positions
      function affineFromControls() {
          const a = ( controlTriangle.east.x - controlTriangle.center.x ) / initialTriangle.radius;
          const c = - ( controlTriangle.north.x - controlTriangle.center.x ) / initialTriangle.radius;
          const b = ( controlTriangle.east.y - controlTriangle.center.y ) / initialTriangle.radius;
          const d = - ( controlTriangle.north.y - controlTriangle.center.y ) / initialTriangle.radius;
          const e = controlTriangle.center.x - a * initialTriangle.center.x - c * initialTriangle.center.y;
          const f = controlTriangle.center.y - b * initialTriangle.center.x - d * initialTriangle.center.y;
          return [ a, b, c, d, e, f ];

      }
      
      // Initialize control triangle from paste bounds
      function initializeControlTriangle() {
          if (!pasteBounds) return;
          
          const centerX = pasteBounds.x + pasteBounds.width / 2;
          const centerY = pasteBounds.y + pasteBounds.height / 2;
          
          // Use minimum dimension to keep handles on screen, with a minimum radius for usability
          const minRadius = 50; // Minimum radius in pixels for comfortable interaction
          const radius = Math.max(minRadius, Math.min(pasteBounds.width, pasteBounds.height) / 2);
          
          controlTriangle = {
              center: { x: centerX, y: centerY },
              north: { x: centerX, y: centerY - radius },
              east: { x: centerX + radius, y: centerY },
              radius: radius
          };
          initialTriangle = {
              center: { ...controlTriangle.center },
              north: { ...controlTriangle.north },
              east: { ...controlTriangle.east },
              radius: controlTriangle.radius
          };
      }
      
      // Check if point is near a control handle
      function getControlHandleAt(x, y) {
          if (!controlTriangle) return null;
          
          const threshold = 15 / zoomLevel; // 15 pixel hit radius
          
          const distToCenter = Math.sqrt(
              Math.pow(x - controlTriangle.center.x, 2) + 
              Math.pow(y - controlTriangle.center.y, 2)
          );
          if (distToCenter < threshold) return 'center';
          
          const distToNorth = Math.sqrt(
              Math.pow(x - controlTriangle.north.x, 2) + 
              Math.pow(y - controlTriangle.north.y, 2)
          );
          if (distToNorth < threshold) return 'north';
          
          const distToEast = Math.sqrt(
              Math.pow(x - controlTriangle.east.x, 2) + 
              Math.pow(y - controlTriangle.east.y, 2)
          );
          if (distToEast < threshold) return 'east';
          
          // Check if on circle (for uniform scale)
          const distToCircle = Math.abs(
              Math.sqrt(Math.pow(x - controlTriangle.center.x, 2) + 
                        Math.pow(y - controlTriangle.center.y, 2)) - 
              controlTriangle.radius
          );
          if (distToCircle < threshold) return 'circle';
          
          return null;
      }
      
      // Constrain north point to circle
      function constrainNorthToCircle(north) {
          const dx = north.x - controlTriangle.center.x;
          const dy = north.y - controlTriangle.center.y;
          const angle = Math.atan2(dy, dx);
          
          return {
              x: controlTriangle.center.x + controlTriangle.radius * Math.cos(angle),
              y: controlTriangle.center.y + controlTriangle.radius * Math.sin(angle)
          };
      }
      
      // Update paste transform from control triangle

          if (!controlTriangle) return;

          pasteTransform = affineFromControls();
          pasteBounds = calculatePasteBounds();
      }
      
      // Render control triangle overlay
      function renderControlTriangle() {
          if (!controlTriangle) return;
          
          ctx.save();

          ctx.lineWidth = 2 / zoomLevel;
          
          // Draw circle
          ctx.strokeStyle = '#888';
          ctx.beginPath();
          ctx.arc(
              controlTriangle.center.x, 
              controlTriangle.center.y, 
              controlTriangle.radius, 
              0, 2 * Math.PI
          );
          ctx.stroke();
          
          // Draw crosshair lines
          ctx.strokeStyle = '#666';
          ctx.lineWidth = 1 / zoomLevel;
          
          // Center to north
          ctx.beginPath();
          ctx.moveTo(controlTriangle.center.x, controlTriangle.center.y);
          ctx.lineTo(controlTriangle.north.x, controlTriangle.north.y);
          ctx.stroke();
          
          // Center to east

          ctx.moveTo(controlTriangle.center.x, controlTriangle.center.y);
          ctx.lineTo(controlTriangle.east.x, controlTriangle.east.y);
          ctx.stroke();

              storedCredential = credential;
          }
          if (urlParams.has('credential')) {
              const address = new URLSearchParams(urlParams);
              address.delete('credential');
              // without any parameter the server would not serve the page on a reload
              if ([...address.keys()].length === 0) {
                  address.set('login', '');
              }
              window.history.replaceState(null, null, `${window.location.pathname}?${address.toString()}`);
          }
          
          const loginParam = urlParams.get('login');
          if (loginParam) {
              session.login = loginParam;
          } else {
              try { session.login = sessionStorage.getItem(SESSION_LOGIN_KEY); } catch (err) { /* storage blocked */ }
          }
          
          // Note: loadSettings() will be called after board registration
          // when we have a valid boardId
          
          setupCanvas();
          setupWebSocket();
          setupEventListeners();
          setupColorPicker();
          setupLayerControls();
          setupSelectionControls();
          updatePasteButton(); // Initialize paste button state
          debugStylusEvents(); // Add stylus debugging
          // setupWebSocket();
      }
      
      // Set up canvas size
      function setupCanvas() {
          resizeCanvas();
          window.addEventListener('resize', resizeCanvas);
      }
      
      // Resize canvas to fit window
      function resizeCanvas() {
          // Hidden behind a full-window view, the container has no size: keep the
          // canvas as it is (a zero-sized one cannot be drawn); the view measures again
          // when it closes
          if (container.clientWidth === 0 || container.clientHeight === 0) {
              return;
          }
          canvas.width = container.clientWidth;
          canvas.height = container.clientHeight;
          
          // Resize background canvas to match
          if (!backgroundCanvas) {
              backgroundCanvas = document.createElement('canvas');
              backgroundCtx = backgroundCanvas.getContext('2d');
          }
          backgroundCanvas.width = canvas.width;
          backgroundCanvas.height = canvas.height;
          backgroundValid = false; // Invalidate on resize
          
          applyZoom();
          requestRedraw();
      }
      
      // Apply zoom and pan transform
      function applyZoom() {
          ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.setTransform(zoomLevel, 0, 0, zoomLevel, panX, panY);
      }
      
      // Show error message
      function showError(message) {
          errorMessage.textContent = message;
          errorBanner.style.display = 'block';
      }
      
      // Hide error message
      function hideError() {
          errorBanner.style.display = 'none';
      }
      
      function createRequestId() {
          return shared.generateUuid();
      }

      // Pending request dispatch system -- replaces fragile ws.onmessage hijacking
      const pendingRequests = new Map();
      const REQUEST_TIMEOUT = 5000;
      const FULL_PAGE_TIMEOUT = 60000; // a whole large page can take far longer than a replay

      function sendWithCallback(request, timeout = REQUEST_TIMEOUT) {
          const requestId = request[shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REQUEST_ID]
                        || request[shared.MESSAGES.CLIENT_TO_SERVER.PAGE_INFO_REQUEST.REQUEST_ID]
                        || request[shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.REQUEST_ID]
                        || request['requestId'];
          return new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                  pendingRequests.delete(requestId);
                  reject(new Error(`Request ${requestId} timed out`));
              }, timeout);
              pendingRequests.set(requestId, { resolve, reject, timer });
              ws.send(JSON.stringify(request));
          });
      }

      function cleanupPendingRequests() {
          for (const [id, entry] of pendingRequests) {
              clearTimeout(entry.timer);
              entry.reject(new Error('WebSocket disconnected'));
          }
          pendingRequests.clear();
      }
      
      // Show synchronization status
      function updateSyncStatus() {
          saveUnconfirmedEdits();
      //     if (present > verifiedIndex) {
      //         // Some actions not yet confirmed by server
      //         syncStatus.textContent = "⟳";
      //         syncStatus.style.color = "#ff9800";
      //     } else {
      //         // All actions confirmed
      //         syncStatus.textContent = "✓";
      //         syncStatus.style.color = "#4caf50";
      //     }
      }
      
      // Calculate exponential backoff delay
      function getReconnectDelay() {
          // Calculate: min(maxDelay, initialDelay * 2^attempts)
          const delay = Math.min(
              maxReconnectDelay,
              initialReconnectDelay * Math.pow(2, reconnectAttempts)
          );
          return delay;
      }
      
      // Schedule automatic reconnection with exponential backoff
      function scheduleReconnect() {
          // Clear any existing reconnection timer
          if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
          }
          
          const delay = getReconnectDelay();
          const seconds = (delay / 1000).toFixed(1);
          
          debugLog(`Scheduling reconnection attempt ${reconnectAttempts + 1} in ${seconds}s`);
          showError(`Connection lost. Reconnecting in ${seconds}s... (Attempt ${reconnectAttempts + 1})` + waitingEditsNote());
          
          reconnectTimer = setTimeout(() => {
              reconnectAttempts++;
              debugLog(`Attempting reconnection (attempt ${reconnectAttempts})`);
              setupWebSocket();
          }, delay);
      }
      
      // Reconnect WebSocket (manual reconnection - resets backoff)
      function reconnectWebSocket() {
          // Clear any pending automatic reconnection
          if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
          }
          
          // Reset reconnection attempts for manual reconnect
          reconnectAttempts = 0;
          
          if (ws) {
              ws.close();
          }
          
          debugLog('Manual reconnection initiated');
          setupWebSocket();
          hideError();
      }
      
      function setupWebSocket() {
          const urlParams = new URLSearchParams(window.location.search);
          boardId = urlParams.get('board');
          passwd = urlParams.get('passwd');

          if( boardId === '00000000-0000-0000-0000-000000000000' ) {
              debugLog( 'load most recent board.' );
              const board_data = loadMostRecentBoard();
              if ( board_data ) {
                  boardId = board_data.boardId;
                  passwd = board_data.passwd;
              } 
          } else {
              debugLog( 'not loading most recent board. current board:', boardId );
          }

          let wsUrl;
          
          // Check if server injected a specific WebSocket URL (direct mode)
          if (typeof WHITEBOARD_WS_URL !== 'undefined' && WHITEBOARD_WS_URL !== null) {
              wsUrl = WHITEBOARD_WS_URL;
              debugLog('Using direct WebSocket URL:', wsUrl);
          } else {
              // Auto-detect mode (proxy mode)
              // location.host includes the port when non-default (hostname would drop it)
              const host = window.location.host;
              const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
              
              wsUrl = `${protocol}//${host}/ws`;
              debugLog('Using auto-detected WebSocket URL:', wsUrl);
          }
          
          debugLog('Connecting to WebSocket:', wsUrl);
          
          ws = new WebSocket(wsUrl);
          connectionEstablished = false;
          
          ws.onopen = () => {
              debugLog('WebSocket connection established');
              
              // Reset reconnection attempts on successful connection
              reconnectAttempts = 0;
              if (reconnectTimer) {
                  clearTimeout(reconnectTimer);
                  reconnectTimer = null;
              }
              
              if (boardId) {
                  // Register with existing board
                  registerBoard(boardId);
              }
              // On load, check a login and credential known from the URL or the tab
              if (!session.loggedIn && session.login && storedCredential) {
                  logIn(session.login, storedCredential, true);
              }
              if (!boardId) {
                  openBoardsView();
              }
          };
          
          ws.onclose = () => {
              debugLog('Disconnected from server');
              connectionEstablished = false;
              cleanupPendingRequests();
              updateUndoRedoButtons();
              
              // Schedule automatic reconnection with exponential backoff
              scheduleReconnect();
          };
          
          ws.onerror = (error) => {
              console.error('WebSocket error:', error);
              connectionEstablished = false;
              showError('Failed to connect to server. Please check your connection.');
          };
          
          ws.onmessage = (event) => {
              try {
                  // debugLog('Received event: ', event); 
                  const data = JSON.parse(event.data); // wire messages are plain JSON
                  if ( data ) {
                      // Check if this message matches a pending request
                      const requestId = data[shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.REQUEST_ID]
                                     || data[shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.REQUEST_ID]
                                     || data[shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.REQUEST_ID]
                                     || data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_INFO.REQUEST_ID]
                                     || data['requestId'];
                      if ( requestId && pendingRequests.has(requestId) ) {
                          const entry = pendingRequests.get(requestId);
                          clearTimeout(entry.timer);
                          pendingRequests.delete(requestId);
                          entry.resolve(data);
                          return;
                      }
                      
                      // debugLog('Received message of type: ', data.type);
                      
                      // Handle message based on type
                      switch (data.type) {
                      case shared.MESSAGES.SERVER_TO_CLIENT.BOARD_CREATED.TYPE:
                          handleBoardCreated(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.BOARD_REGISTERED.TYPE:
                          handleBoardRegistered(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.TYPE:
                          handleFullPageMessage(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.PAGE_REGISTERED.TYPE:
                          handlePageRegistered(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.PAGE_INFO.TYPE:
                          handlePageInfo(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.PAGE_LOST.TYPE:
                          handlePageLost(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.ACCEPT.TYPE:
                          handleAcceptMessage(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.DECLINE.TYPE:
                          handleDeclineMessage(data);
                          break;
                      case shared.MESSAGES.SERVER_TO_CLIENT.REPLAY.TYPE:
                          handleReplayMessage(data);
                          break;
                       case shared.MESSAGES.SERVER_TO_CLIENT.PING.TYPE:
                           handlePingMessage(data);
                           break;
                       case shared.MESSAGES.SERVER_TO_CLIENT.BOARD_INFO.TYPE:
                           handleBoardInfo(data);
                           break;
                       case "error":
                           handleErrorMessage(data);
                           break;
                      default:
                          console.error('Unknown message type:', data.type);
                      }
                  } else {
                      debugLog('Could not deserialize event: ', event); 
                  }
              } catch (error) {
                  console.error('Error processing message:', error);
                  showError(`Error processing message: ${error.message}`);
              }
          };
      }
      
      // Handle server error message
      function handleErrorMessage(data) {
          console.error(`[SERVER ERROR] ${data.message}`, data.stack);
          showError(`Server error: ${data.message}`);
          if (data.message === shared.CREDENTIAL_NOT_ACCEPTED) {
              // do not offer the rejected credential again (the address never holds it)
              storedCredential = null;
              // the way forward: the login form, ready for another credential
              openBoardsView();
              const credentialInput = document.getElementById('new-board-credential-input');
              credentialInput.value = '';
              credentialInput.focus();
          }
      }
      
      // Handle board info response (page order for shuffle)
      function handleBoardInfo(data) {
          const pages = data[shared.MESSAGES.SERVER_TO_CLIENT.BOARD_INFO.PAGES];
          debugLog( "Received Board Info: ", pages );
          if ( pages ) {
              debugLog( "considering new page order" );
 
              // stay on the last page
              if ( pageNr === totalPages && totalPages < pages.length ) {
                  debugLog('Server indicates the board has grown. Stay on the last page');
                  serverPageOrder = pages;
                  totalPages = pages.length;
                  pageNr = totalPages;
                  requestFullPage( pages[ totalPages - 1 ], true, 0 );
                  return;
              }

              const newPageNr = pages.indexOf( currentPageUuid );
              if ( newPageNr < 0 ) {
                  debugLog( "current page not found: ", currentPageUuid );
                  serverPageOrder = pages;
                  if ( !pageSwitchUnderWay() ) {
                      requestPageInfo( currentPageUuid );
                  }
                  return;
              }
              debugLog( "update data" );
              serverPageOrder = pages;
              totalPages = pages.length;
              pageNr = newPageNr + 1;
              updatePageInfo();
          }
          // If overview is active, refresh the grid
          refreshOverviewIfActive();
      }
      
      // Helper to check if overview mode is active
      function isOverviewActive() {
          const overview = document.getElementById('page-overview');
          return overview && overview.classList.contains('visible');
      }
      
      // Helper to refresh overview if it's active
      function refreshOverviewIfActive() {
          if (isOverviewActive()) {
              refreshOverviewGrid();
          }
      }

      // Drag-drop handler for thumbnails (extracted for reuse)
      function handleThumbDrop(e) {
          e.preventDefault();
          const grid = document.getElementById('overview-grid');
          grid.querySelectorAll('.overview-thumb').forEach(t => t.classList.remove('drag-over'));
          
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
          const toIdx = parseInt(this.dataset.index);
          if (fromIdx === toIdx) return;
          
          const thumbs = grid.querySelectorAll('.overview-thumb');
          const fromEl = thumbs[fromIdx];
          const toEl = thumbs[toIdx];
          
          if (fromIdx < toIdx) {
              toEl.parentNode.insertBefore(fromEl, toEl.nextSibling);
          } else {
              toEl.parentNode.insertBefore(fromEl, toEl);
          }
          
          reindexThumbnails();
      }

      function requestBoardInfo() {
          sendMessage({
              type: shared.MESSAGES.CLIENT_TO_SERVER.BOARD_INFO_REQUEST.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.BOARD_INFO_REQUEST.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.BOARD_INFO_REQUEST.REGISTER]: false,
              [shared.MESSAGES.CLIENT_TO_SERVER.BOARD_INFO_REQUEST.REQUEST_ID]: createRequestId()
          });
      }

      function sendShuffleProposal( newOrder ) {
          sendMessage({
              type: shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.TYPE,
              [shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.BOARD]: boardId,
              [shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.PASSWORD]: passwd,
              [shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.BEFORE]: serverPageOrder,
              [shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.AFTER]: newOrder,
              [shared.MESSAGES.CLIENT_TO_SERVER.SHUFFLE_PROPOSAL.REQUEST_ID]: createRequestId()
          });
      }

      // Owner requests carry the login and credential; the server checks each one on
      // its own and keeps no login state. It runs one check per connection at a time,
      // so the requests are sent one after the other.
      let ownerRequests = Promise.resolve();
      function ownerRequest(keys, fields, login = session.login, credential = storedCredential) {
          const request = {
              type: keys.TYPE,
              [keys.LOGIN]: login,
              [keys.PASSWORD]: credential,
              ...fields,
              [keys.REQUEST_ID]: createRequestId()
          };
          const reply = ownerRequests.then(() => sendWithCallback(request));
          ownerRequests = reply.catch(() => {});
          return reply;
      }

      // A refusal of an owner request: a credential no longer accepted (changed in
      // another session, say) ends this client's login
      function ownerRefused(reply) {
          if (reply.message === shared.CREDENTIAL_NOT_ACCEPTED && session.loggedIn) {
              session.loggedIn = false;
              updateBoardManager();
              document.getElementById('login-feedback').textContent = 'Credential not accepted any more, please log in again';
          }
      }

      // "Logged in" exists only in this client: a login and credential that the server
      // accepted for listing the owner's boards. quiet: the automatic check on load,
      // which reports only into the board navigation.
      async function logIn(login, credential, quiet = false) {
          const feedback = document.getElementById('login-feedback');
          feedback.textContent = '';
          let reply;
          try {
              reply = await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.LIST_BOARDS, {}, login, credential);
          } catch (err) {
              session.loggedIn = false;
              feedback.textContent = `Login failed: ${err.message}`;
              updateBoardManager();
              return false;
          }
          if (reply.type === shared.MESSAGES.SERVER_TO_CLIENT.BOARD_LIST.TYPE) {
              session.login = login;
              session.loggedIn = true;
              expandToCurrent = true;
              try { sessionStorage.setItem(SESSION_LOGIN_KEY, session.login); } catch (err) { /* storage blocked */ }
              storedCredential = credential;
              updateBoardManager();
              showBoardListReply(reply);
              return true;
          }
          session.loggedIn = false;
          if (reply.message === shared.CREDENTIAL_NOT_ACCEPTED) {
              // do not offer the rejected credential again (the address never holds it)
              storedCredential = null;
              feedback.textContent = 'Login or credential not accepted';
          } else {
              feedback.textContent = `Login failed: ${reply.message}`;
          }
          updateBoardManager();
          return false;
      }

      // Messages in the board navigation stay until the next action there; ok: a
      // confirmation rather than a refusal
      function setFeedback(id, text, ok = false) {
          const feedback = document.getElementById(id);
          feedback.textContent = text;
          feedback.classList.toggle('ok', ok);
      }

      // Fetch the owner's board list and show it
      async function listBoards() {
          const feedback = document.getElementById('manager-feedback');
          let reply;
          try {
              reply = await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.LIST_BOARDS, {});
          } catch (err) {
              feedback.textContent = `Boards not listed: ${err.message}`;
              return;
          }
          showBoardListReply(reply);
      }

      // A board-list reply (to listing or to a path change): remember and show it;
      // anything else is a refusal, shown as feedback
      function showBoardListReply(reply) {
          const L = shared.MESSAGES.SERVER_TO_CLIENT.BOARD_LIST;
          if (reply.type !== L.TYPE) {
              document.getElementById('manager-feedback').textContent = reply.message;
              ownerRefused(reply);
              return false;
          }
          boardList = reply[L.BOARDS].map(entry => ({
              board: entry[L.ENTRY_BOARD],
              path: entry[L.ENTRY_PATH],
              passwd: entry[L.ENTRY_PASSWORD],
              createdAt: entry[L.ENTRY_CREATED_AT]
          }));
          adoptOwnerPassword();
          renderBoardTree();
          updateCurrentBoardSection();
          return true;
      }

      // The board tree: folders come from the paths, each with its subfolders and boards
      function buildBoardTree(entries) {
          const root = { path: '', folders: new Map(), boards: [] };
          for (const entry of entries) {
              const segments = entry.path.split('/');
              let node = root;
              for (let i = 0; i < segments.length - 1; i++) {
                  if (!node.folders.has(segments[i])) {
                      node.folders.set(segments[i], { path: segments.slice(0, i + 1).join('/'), folders: new Map(), boards: [] });
                  }
                  node = node.folders.get(segments[i]);
              }
              node.boards.push({ name: segments[segments.length - 1], entry });
          }
          return root;
      }

      // The folders a path lies in, outermost first
      function ancestorsOf(path) {
          const segments = path.split('/');
          return segments.slice(0, -1).map((_, i) => segments.slice(0, i + 1).join('/'));
      }

      const byName = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

      // A small icon button in a tree row; its click does not reach the row
      function treeButton(icon, title, onClick) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'tree-btn';
          button.title = title;
          button.appendChild(iconElement(icon));
          button.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
          return button;
      }

      function treeRow(depth, className = '') {
          const row = document.createElement('div');
          row.className = `tree-row ${className}`.trim();
          row.style.setProperty('--depth', depth);
          return row;
      }

      function treeToggle(icon) {
          const toggle = document.createElement('span');
          toggle.className = 'tree-toggle';
          if (icon) { toggle.appendChild(iconElement(icon)); }
          return toggle;
      }

      function treeName(icon, text) {
          const name = document.createElement('span');
          name.className = 'tree-name';
          name.append(iconElement(icon), document.createTextNode(text)); // text, never HTML
          return name;
      }

      // Show the owner's boards as a tree. Folders open are those in expandedFolders;
      // when the view opens, the folders along the current board's path are added. A
      // filter shows only the boards whose path contains it, with their folders open.
      function renderBoardTree() {
          const current = boardList.find(entry => entry.board === boardId);
          if (expandToCurrent) {
              if (current) { ancestorsOf(current.path).forEach(folder => expandedFolders.add(folder)); }
              expandToCurrent = false;
          }
          const filter = document.getElementById('board-filter').value.trim().toLowerCase();
          const entries = filter ? boardList.filter(entry => entry.path.toLowerCase().includes(filter)) : boardList;
          const open = filter ? new Set(entries.flatMap(entry => ancestorsOf(entry.path))) : expandedFolders;

          const tree = document.getElementById('board-tree');
          tree.textContent = '';
          if (entries.length === 0) {
              const empty = document.createElement('div');
              empty.className = 'tree-empty';
              empty.textContent = filter ? 'No board path contains this text' : 'No boards yet';
              tree.appendChild(empty);
              return;
          }
          renderFolderContents(tree, buildBoardTree(entries), 0, open, current, !filter);

          // a row being edited gets the focus
          const editor = tree.querySelector('.tree-edit');
          if (editor) {
              editor.focus();
              if (editor.value) { editor.select(); }
          }
      }

      function renderFolderContents(tree, node, depth, open, current, canToggle) {
          for (const name of [...node.folders.keys()].sort(byName)) {
              const folder = node.folders.get(name);
              if (renaming && renaming.kind === 'folder' && renaming.path === folder.path) {
                  tree.appendChild(pathEditRow(depth, folder.path, to => renameFolder(folder.path, to)));
              } else {
                  const isOpen = open.has(folder.path);
                  const row = treeRow(depth, 'folder');
                  const actions = document.createElement('span');
                  actions.className = 'tree-actions';
                  actions.append(
                      treeButton('new-board', 'New board in this folder', () => {
                          creatingIn = folder.path;
                          expandedFolders.add(folder.path);
                          renderBoardTree();
                      }),
                      treeButton('rename', 'Rename or move this folder with all boards in it', () => {
                          renaming = { kind: 'folder', path: folder.path };
                          renderBoardTree();
                      }));
                  row.append(treeToggle(isOpen ? 'chevron-down' : 'chevron-right'), treeName('folder', name), actions);
                  row.title = folder.path;
                  if (canToggle) {
                      row.addEventListener('click', () => {
                          if (expandedFolders.has(folder.path)) { expandedFolders.delete(folder.path); }
                          else { expandedFolders.add(folder.path); }
                          renderBoardTree();
                      });
                  }
                  tree.appendChild(row);
              }
              if (open.has(folder.path)) {
                  if (creatingIn === folder.path) {
                      tree.appendChild(newBoardRow(depth + 1, folder.path));
                  }
                  renderFolderContents(tree, folder, depth + 1, open, current, canToggle);
              }
          }
          for (const { name, entry } of [...node.boards].sort((a, b) => byName(a.name, b.name))) {
              if (renaming && renaming.kind === 'board' && renaming.path === entry.path) {
                  tree.appendChild(pathEditRow(depth, entry.path, to => setBoardPath(entry.board, to)));
                  continue;
              }
              const row = treeRow(depth, entry === current ? 'current' : '');
              row.title = entry === current ? `${entry.path} (open now)` : entry.path;
              const date = document.createElement('span');
              date.className = 'tree-date';
              date.textContent = new Date(entry.createdAt).toLocaleDateString();
              const actions = document.createElement('span');
              actions.className = 'tree-actions';
              actions.append(
                  treeButton('open', 'Open this board', () => {
                      switchToBoard(entry.board, entry.passwd);
                      closeBoardsView();
                  }),
                  treeButton('rename', 'Rename or move this board', () => {
                      renaming = { kind: 'board', path: entry.path };
                      renderBoardTree();
                  }),
                  treeButton('view-link', 'Copy the view link', () => copyLink(entry.board, null, 'manager-feedback', `View link of "${entry.path}"`)),
                  treeButton('edit-link', 'Copy the edit link', () => copyLink(entry.board, entry.passwd, 'manager-feedback', `Edit link of "${entry.path}"`)));
              row.append(treeToggle(null), treeName('document', name), date, actions);
              tree.appendChild(row);
          }
      }

      // A tree row with a text field: Enter or the check button submits, Escape or the
      // cancel button closes it; a refusal keeps it open with the reason above the tree
      function editRow(depth, value, placeholder, submit, cancel) {
          const row = treeRow(depth);
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'tree-edit';
          input.value = value;
          input.placeholder = placeholder;
          const ok = treeButton('check', 'Save', () => submit(input.value));
          const no = treeButton('cancel', 'Cancel', cancel);
          input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') { e.preventDefault(); submit(input.value); }
              else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancel(); }
          });
          row.append(treeToggle(null), input, ok, no);
          return row;
      }

      // Edit a full path in place (a new folder in it moves the board or folder);
      // save(newPath) resolves to whether the server accepted it
      function pathEditRow(depth, currentPath, save) {
          const done = () => { renaming = null; renderBoardTree(); };
          return editRow(depth, currentPath, 'New path; folders are separated by "/"', async (value) => {
              if (value.trim() === currentPath) { done(); return; }
              if (await save(value)) {
                  renaming = null;
                  const moved = shared.normalizePath(value);
                  if (moved) { ancestorsOf(moved).forEach(folder => expandedFolders.add(folder)); }
                  renderBoardTree();
              }
          }, done);
      }

      // A new board in a folder: the name may contain '/' to start subfolders
      function newBoardRow(depth, folderPath) {
          return editRow(depth, '', `Name of a new board in ${folderPath}`, (name) => {
              if (name.trim()) { createBoard(`${folderPath}/${name}`); }
          }, () => { creatingIn = null; renderBoardTree(); });
      }

      function boardLink(board, password) {
          let link = `${window.location.origin}${window.location.pathname}?board=${board}`;
          if (password) {
              link += `&passwd=${password}`;
          }
          return link;
      }

      // Copy a view link (password null) or an edit link and say so in a feedback line
      async function copyLink(board, password, feedbackId, what) {
          try {
              await navigator.clipboard.writeText(boardLink(board, password));
              setFeedback(feedbackId, `${what} copied`, true);
          } catch (err) {
              setFeedback(feedbackId, `Could not copy the link: ${err.message}`);
          }
      }

      // Change the logged-in user's credential (current: as typed into the form)
      async function changeCredential(current, replacement) {
          const feedback = document.getElementById('credential-feedback');
          setFeedback('credential-feedback', '');
          let reply;
          try {
              reply = await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.CHANGE_CREDENTIAL, {
                  [shared.MESSAGES.CLIENT_TO_SERVER.CHANGE_CREDENTIAL.NEW_PASSWORD]: replacement
              }, session.login, current);
          } catch (err) {
              feedback.textContent = `Credential not changed: ${err.message}`;
              return;
          }
          if (reply.type !== shared.MESSAGES.SERVER_TO_CLIENT.CREDENTIAL_CHANGED.TYPE) {
              feedback.textContent = `Credential not changed: ${reply.message}`;
              return;
          }
          // the new credential replaces the remembered one, as a login would
          storedCredential = replacement;
          document.getElementById('change-credential-form').reset();
          setFeedback('credential-feedback', 'Credential changed. Use the new one from now on.', true);
      }

      function handleChangeCredential(e) {
          e.preventDefault();
          const current = document.getElementById('current-credential-input').value;
          const replacement = document.getElementById('new-credential-input').value;
          const repeated = document.getElementById('repeat-credential-input').value;
          const feedback = document.getElementById('credential-feedback');
          if (replacement !== repeated) {
              feedback.textContent = 'The new credentials differ';
              return;
          }
          changeCredential(current, replacement);
      }

      // Rename or move one board; the reply is the updated board list
      async function setBoardPath(board, path) {
          const feedback = document.getElementById('manager-feedback');
          setFeedback('manager-feedback', '');
          try {
              return showBoardListReply(await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.SET_PATH, {
                  [shared.MESSAGES.CLIENT_TO_SERVER.SET_PATH.BOARD]: board,
                  [shared.MESSAGES.CLIENT_TO_SERVER.SET_PATH.PATH]: path
              }));
          } catch (err) {
              feedback.textContent = `Board not renamed: ${err.message}`;

          }
      }

      // Rename or move a folder, i.e. every board below it; the reply is the updated board list
      async function renameFolder(from, to) {
          const feedback = document.getElementById('manager-feedback');
          setFeedback('manager-feedback', '');
          try {
              return showBoardListReply(await ownerRequest(shared.MESSAGES.CLIENT_TO_SERVER.RENAME_PREFIX, {
                  [shared.MESSAGES.CLIENT_TO_SERVER.RENAME_PREFIX.FROM]: from,
                  [shared.MESSAGES.CLIENT_TO_SERVER.RENAME_PREFIX.TO]: to
