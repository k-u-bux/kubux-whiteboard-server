                  let initialPageData = loadPageFromCache( pageUuid );
                  let pageHashes = [ shared.hashAny( pageUuid ) ];
                  for ( let i = 0; i < initialPageData['history'].length; ++ i ) {
                      pageHashes.push( shared.hashNext( pageHashes[ i ], initialPageData['history'][ i ] ) );
                  }
                  initialPageData['present'] = 0;
                  initialPageData['hash'] = pageHashes[ 0 ];
                  for ( let j = pageSnapshots.length - 1; j >= 0; --j ) {
                      const snapshot = pageSnapshots[ j ];
                      const index = pageHashes.indexOf( snapshot );
                      if ( index >= 0 ) {
                          initialPageData['present'] = index;
                          initialPageData['hash'] = snapshot;
                          break;
                      }
                  }          
                  savePageToCache( pageUuid, initialPageData );

                  // Request and wait for page data
                  let pageData;
                  if ( initialPageData['hash'] === pageSnapshots[ pageSnapshots.length - 1 ] ) {
                      // Cache is already up to date with server — use it directly
                      debugLog("Skip replay, data aleady cached: ", {
                                  page: pageUuid,
                                  present: initialPageData['present'],
                                  hash: initialPageData['hash'],
                                  ourHashes: pageHashes
                               });
                      pageData = initialPageData;
                  } else {
                      debugLog("Preparing replay: ", {
                                  page: pageUuid,
                                  present: initialPageData['present'],
                                  hash: initialPageData['hash'],
                                  ourHashes: pageHashes
                               });
                      try {
                          pageData = await sendWithCallback({
                              type: shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.TYPE,
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.BOARD]: boardId,
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PAGE]: pageUuid,
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT]: initialPageData[ 'present' ],
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.PRESENT_HASH]: initialPageData[ 'hash' ],
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REGISTER]: false,
                              [shared.MESSAGES.CLIENT_TO_SERVER.REPLAY_REQUEST.REQUEST_ID]: createRequestId()
                          });
                          pageData = handleReplayMessage( pageData, true );
                      } catch (err) {
                          console.warn(`Replay for page ${pageUuid} failed: ${err.message}`);
                          pageData = null;
                      }
                  }

                  // The cached copy could not be brought up to date: fetch the whole page instead
                  if ( !pageData ) {
                      debugLog(`Replay for page ${pageUuid} gave no data, fetching the full page`);
                      try {
                          pageData = await fetchFullPage( pageUuid );
                      } catch (err) {
                          console.warn(`Skipping page ${pageUuid}: ${err.message}`);
                          skipped.push(`${idx + 1} (${err.message})`);
                          addMissingPagePlaceholder(builder, idx + 1, pageUuids.length, err.message);
                          continue;
                      }
                  }
                  
                  // Use format dimensions if set, else canvas size
                  const pdfBoardW = canvasFormat ? canvasFormat.w : canvas.width;
                  const pdfBoardH = canvasFormat ? canvasFormat.h : canvas.height;
                  const pdfCtx = builder.new_page(pdfBoardW, pdfBoardH);
                  
                   if ( !canvasFormat ) {
                       pdfCtx.transform(zoomLevel, 0, 0, zoomLevel, panX, panY);
                   } else {
                       pdfCtx.transform(1, 0, 0, 1, 0, 0);
                       pdfCtx.save();
                       pdfCtx.rect(0, 0, canvasFormat.w, canvasFormat.h);
                       pdfCtx.clip();
                   }
                   
                   // Compile visual state for this page
                  const pageVisualState = shared.createEmptyVisualState();
                  const pageActions = pageData.history.slice(0, pageData.present);
                  for (const action of pageActions) {
                      shared.commitEdit(pageVisualState, action);
                  }
                  
                  // Render all visible elements as vectors
                  shared.render_all_visible_elements(pageVisualState, (element) => {
                      if (visibleLayers.has(element[shared.ELEMENT.LAYER])) {
                          renderElement(pdfCtx, element);
                      }
                  });

                  if ( canvasFormat ) {
                      pdfCtx.restore();
                  }
              }

               if (skipped.length === pageUuids.length) {
                   showError(`PDF export failed, no page could be loaded: ${skipped.join(', ')}`);
                   return;
               }
               builder.download_in_browser(filename);
               hideError();
               if (skipped.length > 0) {
                   showError(`PDF exported without page(s) ${skipped.join(', ')}`);
               }

           } catch (err) {
               hideError();
               showError(`PDF export failed: ${err.message}`);
               console.error('PDF export error:', err);
           }
       }

      // Parse whiteboard URL to extract board ID and password
      function parseWhiteboardURL(urlString) {
          try {
              const url = new URL(urlString);
              
              // Check if it's the same origin (same domain)
              if (url.origin !== window.location.origin) {
                  return null; // Different domain - invalid
              }
              
              // Extract board ID and password from query parameters
              const params = new URLSearchParams(url.search);
              const boardId = params.get('board');
              
              if (!boardId) {
                  return null; // No board ID - invalid
              }
              
              return {
                  boardId: boardId,
                  password: params.get('passwd') || ''
              };
          } catch (e) {

          }

          thumb.addEventListener('dragend', function() { this.classList.remove('drag-over'); });
          thumb.addEventListener('dragover', function(e) {
              e.preventDefault();
              document.querySelectorAll('#overview-grid .overview-thumb').forEach(t => t.classList.remove('drag-over'));
              this.classList.add('drag-over');
          });
          thumb.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
          thumb.addEventListener('drop', handleThumbDrop);

          return thumb;
      }

      function refreshOverviewGrid() {
          // console.error( "refresh grid" );
          const overviewEl = document.getElementById('page-overview');
          if (!overviewEl || !overviewEl.classList.contains('visible')) return;
          
          const grid = document.getElementById('overview-grid');
          const pageOrder = serverPageOrder.length > 0 ? serverPageOrder : buildPageOrderFromMeta();
          const serverOrderSet = new Set(pageOrder);
      
          // 1. Eviction: Remove elements that no longer exist on the server
          const existingThumbs = Array.from(grid.querySelectorAll('.overview-thumb'));
          existingThumbs.forEach(thumb => {
              if (!serverOrderSet.has(thumb.dataset.pageUuid)) {
                  thumb.remove();
              }
          });
      
          // 2. Interleaving: Find and insert brand-new elements from the server
          pageOrder.forEach((uuid, serverIdx) => {
              // Check if this server element already exists locally
              const existingThumb = grid.querySelector(`[data-page-uuid="${uuid}"]`);
              if (existingThumb) return; // Skip: local order/permutation must be preserved
      
              // Element is brand new. Instantiate it.
              const newThumb = createThumbnailElement(uuid, serverIdx, overviewThumbState.w, overviewThumbState.h);
              // Find predecessor in server order that exists in DOM, insert after it
              let referenceSibling = null;
              for (let i = serverIdx - 1; i >= 0; i--) {
                  const prevUuid = pageOrder[i];
                  const matchingLocalThumb = grid.querySelector(`[data-page-uuid="${prevUuid}"]`);
                  if (matchingLocalThumb) {
                      referenceSibling = matchingLocalThumb.nextSibling;
                      break;
                  }
              }
              grid.insertBefore(newThumb, referenceSibling);
          });
      
          // 3. Re-index: Correct data-index and labels to match the new combined DOM layout
          reindexThumbnails();
          
          // Trigger render pipelines
          renderThumbnails();
          requestThumbnailData();
      }

      // Page Overview Mode
      function enterOverviewMode() {
          if (refusedWhileOffline()) return;
          commitCurrentPage();
          const overview = document.getElementById('page-overview');
          const grid = document.getElementById('overview-grid');
          if (grid) {
              grid.innerHTML = ''; // Forces a complete rebuild, killing local mutations
          }

          // Snapshot viewport dimensions BEFORE hiding the container
          overviewThumbState.viewportW = container.clientWidth;
          overviewThumbState.viewportH = container.clientHeight;
          
          // Determine thumbnail aspect ratio
          let thumbW, thumbH;
          if (canvasFormat) {
              thumbW = Math.round( canvasFormat.w / 6 );
              thumbH = Math.round( canvasFormat.h / 6 );
          } else {
              thumbW = Math.round( container.clientWidth / 6 );
              thumbH = Math.round( container.clientHeight / 6 );
          }
          overviewThumbState.w = thumbW;
          overviewThumbState.h = thumbH;
          
          // Show overview, hide normal UI
          document.body.classList.add('overview-active');
          overview.classList.add('visible');
          
          // Build grid and request data
          refreshOverviewGrid();
          requestBoardInfo();

      function exitOverviewMode(confirmed) {

              const grid = document.getElementById('overview-grid');

              const newOrder = [];
              
              thumbs.forEach(thumb => {
                  const uuid = thumb.dataset.pageUuid;
                  if (uuid) newOrder.push(uuid);
              });
              
              if (newOrder.length > 0 && JSON.stringify(newOrder) !== JSON.stringify(serverPageOrder)) {
                  sendShuffleProposal(newOrder);

          document.body.classList.remove('overview-active');

      function renderThumbnails() {
          const grid = document.getElementById('overview-grid');
          const thumbs = grid.querySelectorAll('.overview-thumb');
          
          // Determine source rectangle (page coordinates) that each thumbnail shows
          let srcX, srcY, srcW, srcH;
          if (canvasFormat) {
              srcX = 0;
              srcY = 0;
              srcW = canvasFormat.w;
              srcH = canvasFormat.h;
          } else {
              srcX = -panX / zoomLevel;
              srcY = -panY / zoomLevel;
              const vw = overviewThumbState.viewportW || container.clientWidth;
              const vh = overviewThumbState.viewportH || container.clientHeight;
              srcW = (vw || canvas.width) / zoomLevel;
              srcH = (vh || canvas.height) / zoomLevel;
          }
          
          thumbs.forEach((thumb, idx) => {
              const canvas = thumb.querySelector('canvas');
              const ctx = canvas.getContext('2d');
              const spinner = thumb.querySelector('.overview-thumb-spinner');
              
              // Read pageUuid from the thumb's dataset
              const pageUuid = thumb.dataset.pageUuid;
              if (!pageUuid) {
                  spinner.classList.add('active');
                  return;
              }
              
              const pageData = loadPageFromCache(pageUuid);
              if (!pageData || !pageData.history) {
                  spinner.classList.add('active');
                  return;
              }
              
              // Data is available — hide spinner and render
              spinner.classList.remove('active');
              
              // Recompile visual state from page data
              const vs = shared.createEmptyVisualState();
              const actions = pageData.history.slice(0, pageData.present);
              for (const action of actions) {
                  shared.commitEdit(vs, action);
              }
              
              // Render at full resolution on an offscreen canvas, then scale down
              const offscreen = document.createElement('canvas');
              offscreen.width = Math.ceil(srcW);
              offscreen.height = Math.ceil(srcH);
              const offCtx = offscreen.getContext('2d');
              
              offCtx.fillStyle = 'white';
              offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
              
              shared.render_all_visible_elements(vs, (element) => {
                  renderElement(offCtx, element);
              });
              
              ctx.imageSmoothingEnabled = true;
              ctx.drawImage(offscreen, 0, 0, offscreen.width, offscreen.height,
                            0, 0, canvas.width, canvas.height);
          });
      }
       
      // Thumbnail pages are requested in parallel, but a page is not requested
      // again while its latest request is younger than THUMBNAIL_RETRY_AFTER: the
      // overview refreshes on every incoming message, and requesting all missing
      // pages on each refresh used to send the same large pages again and again.
      // Replies are matched to their request by requestId; when two requests for
      // a page are answered, the reply to the more recent one wins.
      const THUMBNAIL_RETRY_AFTER = 10000;
      const thumbnailRequests = new Map(); // pageUuid -> { requestId, sentAt } of the latest request

      function requestThumbnailData() {
          // For pages not in cache, request data
          const grid = document.getElementById('overview-grid');
          const thumbs = grid.querySelectorAll('.overview-thumb');
          thumbs.forEach( ( thumb, idx ) => {
              const pageUuid = thumb.dataset.pageUuid;
              if ( ! pageUuid ) {
                  console.error( "thumbnail should know its uuid" );
                  return;
              }
              const pageData = loadPageFromCache( pageUuid, false );
              if ( pageData ) { return; }
              const latest = thumbnailRequests.get( pageUuid );
              if ( latest && Date.now() - latest.sentAt < THUMBNAIL_RETRY_AFTER ) { return; }
              requestThumbnailPage( pageUuid );
          });
      }

      async function requestThumbnailPage( pageUuid ) {
          const requestId = createRequestId();
          thumbnailRequests.set( pageUuid, { requestId, sentAt: Date.now() } );
          const isLatest = () => thumbnailRequests.get( pageUuid )?.requestId === requestId;
          try {
              const reply = await sendWithCallback({
                  type: shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.TYPE,
                  [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.BOARD]: boardId,
                  [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.PAGE]: pageUuid,
                  [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.DELTA]: 0,
                  [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.REGISTER]: false,
                  [shared.MESSAGES.CLIENT_TO_SERVER.FULL_PAGE_REQUEST.REQUEST_ID]: requestId
              }, FULL_PAGE_TIMEOUT);
              if ( reply.type !== shared.MESSAGES.SERVER_TO_CLIENT.FULL_PAGE.TYPE ) {
                  // page-lost: the page was deleted; the next board-info removes its thumbnail
                  debugLog( `Thumbnail page ${pageUuid} not fetched: ${reply.type}` );
                  if ( isLatest() ) { thumbnailRequests.delete( pageUuid ); }
                  return;
              }
              if ( isLatest() ) {
                  thumbnailRequests.delete( pageUuid );
                  handleFullPageMessage( reply ); // caches the page and redraws the grid
              } else if ( ! loadPageFromCache( pageUuid, false ) ) {
                  // superseded, but better than nothing until the newer reply arrives
                  handleFullPageMessage( reply );
              }
          } catch ( err ) {
              // timeout or disconnect: the next refresh may ask again
              console.warn( `Thumbnail page ${pageUuid} not fetched: ${err.message}` );
              if ( isLatest() ) { thumbnailRequests.delete( pageUuid ); }
          }
      }

      // Overview: move selected pages to front (true) or back (false)

          const grid = document.getElementById('overview-grid');
          const checked = grid.querySelectorAll('.overview-thumb.selected');
          if (checked.length === 0) return;
          
          const selected = Array.from(checked);
          if (toFront) {

                  const t = selected[i];

      function handleLogin(e) {
          e.preventDefault();
          const login = document.getElementById('login-input').value.trim();
          const credential = document.getElementById('new-board-credential-input').value.trim();
          if (!login || !credential) {
              return;
          }
          logIn(login, credential);
      }

      function handleNewBoard(e) {
          e.preventDefault();
          // a full path: folders separated by '/'; the server normalizes it
          createBoard(document.getElementById('new-board-name').value);
      }
      
      function handleGotoBoard(e) {
          e.preventDefault();
          
          const boardUrlInput = document.getElementById('board-url-input').value.trim();
          const boardIdInput = document.getElementById('board-id-input').value.trim();
          const boardPasswordInput = document.getElementById('board-password-input').value;
          
          let targetBoardId = null;
          let targetPassword = null;
          
          // Try to parse URL first if provided
          if (boardUrlInput) {
              const parsed = parseWhiteboardURL(boardUrlInput);
              
              if (!parsed) {
                  setFeedback('current-feedback', 'Not a link to a board on this server');
                  return;
              }
              
              targetBoardId = parsed.boardId;
              targetPassword = parsed.password;
          } else if (boardIdInput) {
              // Use manual entry if URL not provided
              targetBoardId = boardIdInput;
              targetPassword = boardPasswordInput;
          } else {
              setFeedback('current-feedback', 'Paste a board link or enter a board ID');
              return;
          }

          if (!shared.isUuid(targetBoardId)) {
              setFeedback('current-feedback', 'Not a valid board ID');
              return;
          }

          switchToBoard(targetBoardId, targetPassword);
          closeBoardsView();
      }

      // The address bar shows the board's share link and nothing else: the edit link if
      // this page can edit, else the view link; login and credential never stay in it.
      // setupWebSocket reads board and password back from it on every (re)connect.
      function showShareAddress() {
          let query = `?board=${encodeURIComponent(boardId)}`;
          if (passwd) {
              query += `&passwd=${encodeURIComponent(passwd)}`;
          }
          window.history.replaceState(null, null, `${window.location.pathname}${query}`);
      }

      // An owner can always edit their boards: the board list carries the edit password,
      // so a board opened with its view link (or an outdated password) gets edit rights
      function adoptOwnerPassword() {
          const entry = boardList.find(e => e.board === boardId);
          if (entry && passwd !== entry.passwd) {
              passwd = entry.passwd;
              showShareAddress();
          }
      }

      // Show another board in this page, without a reload: the login and the credential,
      // which live only in this page, stay
      function switchToBoard(targetBoardId, targetPassword) {
          boardId = targetBoardId;
          passwd = targetPassword;
          adoptOwnerPassword();
          registerBoard(boardId);
          showShareAddress();
          expandToCurrent = true;
          updateCurrentBoardSection();
      }
      
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                  .then(registration => {
                      console.log('Service Worker registered:', registration.scope);
                  })
                  .catch(error => {
                      console.log('Service Worker registration failed:', error);
                  });
          });
      }
      
      // Initialize the app
      window.addEventListener('DOMContentLoaded', init);
      setTool('pen1');
      updateKnobs();
    </script>
  </body>
</html>
